[package]
name = "tylertoo-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tylertoo-core = { path = "../crates/core", features = ["fuzzing"] }

[features]
# Only the `remote_footer` target needs it (object_store, tokio); the other
# targets build without it so their sanitizer build stays lean.
remote = ["tylertoo-core/remote"]

[[bin]]
name = "footer_json"
path = "fuzz_targets/footer_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wkb"
path = "fuzz_targets/wkb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "geoparquet_wkb"
path = "fuzz_targets/geoparquet_wkb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pmtiles_header"
path = "fuzz_targets/pmtiles_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pmtiles_directory"
path = "fuzz_targets/pmtiles_directory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mvt_decode"
path = "fuzz_targets/mvt_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "band_archive"
path = "fuzz_targets/band_archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filter_expr"
path = "fuzz_targets/filter_expr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "geo_metadata"
path = "fuzz_targets/geo_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plan_file"
path = "fuzz_targets/plan_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_archive"
path = "fuzz_targets/decode_archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_index"
path = "fuzz_targets/archive_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "layer_zooms"
path = "fuzz_targets/layer_zooms.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parquet_footer"
path = "fuzz_targets/parquet_footer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "overview_file"
path = "fuzz_targets/overview_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "remote_footer"
path = "fuzz_targets/remote_footer.rs"
test = false
doc = false
bench = false
required-features = ["remote"]

[[bin]]
name = "shard_plan"
path = "fuzz_targets/shard_plan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decompress"
path = "fuzz_targets/decompress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cli_args"
path = "fuzz_targets/cli_args.rs"
test = false
doc = false
bench = false

# Standalone workspace: this crate is deliberately NOT a member of the root
# workspace, so it never affects `cargo build/check/test --workspace` or the
# per-PR CI wall time. Run it explicitly with `cargo fuzz` (see README.md).
[workspace]
members = ["."]
