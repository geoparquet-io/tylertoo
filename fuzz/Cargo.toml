[package]
name = "tylertoo-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tylertoo-core = { path = "../crates/core", features = ["fuzzing"] }

[[bin]]
name = "footer_json"
path = "fuzz_targets/footer_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wkb"
path = "fuzz_targets/wkb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "geoparquet_wkb"
path = "fuzz_targets/geoparquet_wkb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pmtiles_header"
path = "fuzz_targets/pmtiles_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pmtiles_directory"
path = "fuzz_targets/pmtiles_directory.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mvt_decode"
path = "fuzz_targets/mvt_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "band_archive"
path = "fuzz_targets/band_archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filter_expr"
path = "fuzz_targets/filter_expr.rs"
test = false
doc = false
bench = false

# Standalone workspace: this crate is deliberately NOT a member of the root
# workspace, so it never affects `cargo build/check/test --workspace` or the
# per-PR CI wall time. Run it explicitly with `cargo fuzz` (see README.md).
[workspace]
members = ["."]
