# CI — the PR quality gates.
#
# Purpose: every job here is a *blocking* check for PRs into main, through
# the one required check, `CI passed` (the `ci-passed` job at the bottom).
# Humans only review what machines can't check; everything below is
# machine-checked:
#   Plan            decides what this run tests (see "WHAT RUNS WHEN")
#   Lint            one runner for the small checks: version fields in sync,
#                   cargo-audit + cargo-deny, zizmor on these workflows,
#                   Vale + proselint on the handwritten docs, the public-API
#                   baseline, and a build on the declared MSRV
#   Check           rustfmt, clippy (-D warnings + curated lint set in
#                   Cargo.toml [workspace.lints]), cargo-shear, unit tests,
#                   jscpd and similarity-rs duplicate detection
#   Test            the `quick` nextest tier (ubuntu/macos stable; beta on
#                   main) — see .config/nextest.toml (#457); installs the
#                   pinned tippecanoe so the tippecanoe-decode golden test
#                   runs rather than skips (#420)
#   Slow Tests      the slow tests `quick` excludes; Test + Slow Tests
#                   together cover the `full` tier, split into three shards
#                   (ubuntu on PRs; ubuntu + macos on main)
#   Python Quality  ruff check/format (docstrings: pydocstyle, pydoclint,
#                   W505), mypy + stubtest, ty, doctests, vulture, xenon,
#                   pip-audit — all via uv against the committed lockfile
#   Python Tests    the binding's pytest suite on macOS and Windows, the
#                   other two wheel platforms (Linux runs in Python Quality)
#   Docs            the committed CLI + Python reference (docs/reference/)
#                   matches regeneration from source; rustdoc -D warnings;
#                   tests/docs runs both tutorials, the README quickstart,
#                   the --help flag check, and the strict site build
#   Coverage        cargo-llvm-cov -> lcov; Codecov native project targets
#                   cover workspace, core and CLI
#   Gate scripts    pytest for the independent archive verifier
#   Mutation gate   cargo-mutants --in-diff for core and CLI on PRs
#   CI passed       fails if any job above failed or was cancelled; the only
#                   CI context branch protection requires
#
# WHAT RUNS WHEN. The org's free plan runs 20 jobs at once, 5 of them on
# macOS, across every PR and every push to main. A PR that started ~31 jobs
# spent most of its hour queued, so PRs run a smaller set:
#   pull_request    Test on ubuntu + macos stable; Slow Tests on ubuntu.
#                   A PR that touches only docs (scripts/ci/docs_only.sh)
#                   runs just Plan, Lint, Docs and the gate. One that
#                   touches only docs and the Python side
#                   (scripts/ci/python_only.sh: crates/python outside its
#                   Rust, examples/) also runs the Python jobs, and skips
#                   Test, Slow Tests, Coverage and Lint's build steps. Check and
#                   cargo-deny still run, alongside Python Quality.
#   push to main    everything: adds the beta Test lanes and the macOS Slow
#                   Tests, so a macOS-only or beta break shows up on the
#                   merge that caused it. This is also the backstop for two
#                   PRs that pass apart and break together: there is no
#                   merge queue (it re-ran every green PR for ~24 min, #756),
#                   and the required checks are not strict, so a PR merges
#                   without being rebased onto the latest main.
#   workflow_dispatch  everything, on any branch. Run it on a PR that
#                   changes pipeline internals, sharding, determinism or
#                   platform-sensitive code, before merging.
# A job skipped on purpose reports "skipped", which `CI passed` accepts.
#
# CACHES. Each job restores its target/ cache (exact key, else the newest
# entry by prefix, so a Cargo.lock bump starts warm), and only main saves:
# PR refs writing ~1 GB entries pushed the repo past its 10 GB cache cap
# and evicted main's, which PRs restore from (#756). The beta lanes run
# only on main against a moving toolchain, so they don't cache target/.
#
# Benchmarks run in codspeed.yml (per PR) and bench-regression.yml (label,
# weekly); mutation testing runs
# in mutation-tests.yml (weekly); the tippecanoe parity gate (#420) runs in
# tippecanoe-compare.yml (PRs, push to main, weekly).
#
# TOOLCHAIN POLICY: floating `stable` for all gates, with a `beta` lane in the
# Test matrix as the early-warning system for upcoming rustc/clippy breakage
# (a new stable clippy once cost a morning — beta surfaces that a cycle
# early). The beta lanes run on every push to main, not on PRs: a beta break
# comes from the toolchain, not from the PR, and main sees several pushes a
# day. We deliberately do NOT pin the toolchain: a pin needs a scheduled
# bump job that itself rots, while beta failures are visible and actionable.
# All third-party actions are pinned by commit SHA (enforced by zizmor);
# Dependabot bumps the pins.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR to keep the feedback loop short.
# Every other event gets its own group per commit (#779): with one group
# per ref, a third push to main cancelled the second one's queued run, so
# 8 of 40 main runs never ran their macOS Slow Tests and beta lanes. Each
# merge to main must get the full run; it is the backstop for PRs that
# pass apart and break together (see WHAT RUNS WHEN).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Plan: what this run tests. See "WHAT RUNS WHEN" in the header. Every
  # other job reads these outputs, so they are the one place the PR/main
  # split lives.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
      rust: ${{ steps.plan.outputs.rust }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      slow_matrix: ${{ steps.plan.outputs.slow_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD^1 (the base tip) for the docs-only diff below.
          fetch-depth: 2

      - name: Decide what runs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # code: anything beyond docs (runs the Python jobs).
          # rust: anything beyond docs and the Python side (runs the Rust
          # jobs too). See scripts/ci/{docs,python}_only.sh.
          code=true
          rust=true
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            if scripts/ci/docs_only.sh <<<"$changed"; then
              code=false
            fi
            if scripts/ci/python_only.sh <<<"$changed"; then
              rust=false
            fi
          fi

          if [ "$EVENT" = pull_request ]; then
            test_matrix='{"os":["ubuntu-latest","macos-latest"],"rust":["stable"]}'
            slow_os='["ubuntu-latest"]'
          else
            test_matrix='{"os":["ubuntu-latest","macos-latest"],"rust":["stable","beta"]}'
            slow_os='["ubuntu-latest","macos-latest"]'
          fi
          slow_matrix="{\"os\":$slow_os,\"shard\":[\"heavy\",\"determinism\",\"rest\"]}"

          {
            echo "code=$code"
            echo "rust=$rust"
            echo "test_matrix=$test_matrix"
            echo "slow_matrix=$slow_matrix"
          } | tee -a "$GITHUB_OUTPUT"

  # Fast feedback: formatting, lints, dead deps, unit tests
  check:
    name: Check
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the release's Parquet fixtures are cached, keyed on their
      # pointer files (the checkout fetches no large files): adding or
      # changing one downloads the release again, and the fixtures tracked
      # as plain files (.wkb, the README) always come from the checkout.
      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata/*.parquet
          key: fixtures-v1-${{ runner.os }}-${{ hashFiles('tests/fixtures/realdata/*.parquet') }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install cargo-shear
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-shear

      # The musl release binary carries a musl-only #[global_allocator]
      # (#480) that no other job compiles. cargo check needs no musl linker,
      # so this catches cfg mistakes (e.g. clashing with the dhat-heap
      # allocator) without a full cross build.
      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install similarity-rs
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: similarity-rs@0.5.0

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-build-target-

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        # -D warnings also denies the curated [workspace.lints.clippy] set
        # (pedantic subset + cognitive_complexity) defined in Cargo.toml.
        # --all-features includes dhat-heap, so this is also the check that
        # the profiling build compiles on glibc (it was a separate release
        # build, "Profiling Features", until the job count had to come down).
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check musl target compiles (both allocator arrangements)
        # The CLI's musl-only #[global_allocator] (#480) must coexist with
        # the dhat-heap allocator cfg; neither musl combination is compiled
        # by any other step. musl-tools provides musl-gcc for the -sys crates'
        # C code (zstd, mimalloc).
        run: |
          sudo apt-get install -y musl-tools
          cargo check --locked --target x86_64-unknown-linux-musl -p tylertoo
          cargo check --locked --target x86_64-unknown-linux-musl -p tylertoo --features dhat-heap

      - name: Check for unused dependencies
        # cargo-shear, not cargo-machete: it also inspects
        # [workspace.dependencies], where machete only reads member crates.
        # Intentional non-code deps are listed under
        # [package.metadata.cargo-shear] in the owning crate.
        run: cargo shear

      - name: Check for duplicated Rust and Python (jscpd)
        run: npx --yes jscpd@4.0.5 --config .jscpd.json

      - name: Check for duplicated Rust functions (similarity-rs)
        run: similarity-rs --threshold 0.94 --min-lines 10 --skip-test --fail-on-duplicates crates/io/src crates/core/src crates/cli/src crates/python/src

      - name: Run unit tests
        run: cargo test --locked --lib --all-features

      # Main only; see CACHES in the header.
      - name: Save cargo build cache
        if: always() && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  # Full test suite
  # The matrix comes from the plan job: ubuntu + macos stable on PRs, plus
  # beta on main (see "WHAT RUNS WHEN" in the header).
  test:
    name: Test
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata/*.parquet
          key: fixtures-v1-${{ runner.os }}-${{ hashFiles('tests/fixtures/realdata/*.parquet') }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        if: matrix.rust == 'stable'
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-build-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-${{ matrix.rust }}-cargo-build-target-

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest

      # The tippecanoe-decode golden comparison in decode_roundtrip.rs is a
      # hard failure on CI when the binary is missing (#420; it skipped
      # silently before, so it had never run here). Pinned tag + commit SHA,
      # built into .tools/ and cached on the setup script's hash - the same
      # build tippecanoe-compare.yml gates against.
      - name: Install tippecanoe build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libsqlite3-dev zlib1g-dev

      - name: Cache tippecanoe
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/tippecanoe-*
            .tools/src-*
          key: tippecanoe-${{ hashFiles('benchmarks/e2e/setup_tippecanoe.sh') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build tippecanoe (pinned tag + SHA) and put it on PATH
        run: |
          benchmarks/e2e/setup_tippecanoe.sh
          eval "$(benchmarks/e2e/setup_tippecanoe.sh --print-path)"
          dirname "$TIPPECANOE_BIN" >> "$GITHUB_PATH"

      # leaf_directory_integration runs `pmtiles verify` on its archives and
      # fails on CI when the CLI is missing (#779; it passed vacuously
      # before). The pinned, checksummed go-pmtiles that e2e.yml uses.
      - name: Install go-pmtiles (pinned, checksummed)
        run: |
          scripts/setup_go_pmtiles.sh
          eval "$(scripts/setup_go_pmtiles.sh --print-path)"
          echo "PMTILES_BIN=$PMTILES_BIN" >> "$GITHUB_ENV"

      - name: Run all tests (quick tier)
        # `quick` excludes the slow end-to-end suites (#524) and the manual
        # large-polygon regression test (see tests/fixtures/realdata/README.md)
        # — see .config/nextest.toml for the full filter and rationale (#457).
        # nextest runs every test from every binary in parallel.
        run: cargo nextest run --locked --all-features --profile quick

      - name: Run doctests
        # nextest does not run doctests.
        run: cargo test --locked --all-features --doc

      - name: Check the mutation run builds every test binary it should
        # .cargo/mutants.toml names the core test binaries cargo-mutants
        # builds per mutant (only those with a test the run would execute,
        # so the slow-tier and all-#[ignore] binaries are not relinked
        # ~10,300 times a sweep). A binary missing from that list is tested
        # nowhere in the weekly sweep, so the list must follow the tree:
        # this fails when crates/core/tests or the nextest slow set changed
        # and the list did not. Fix: scripts/mutants-test-binaries.sh
        # prints the current array. One lane is enough (the list is
        # platform-independent). It lists at default features, which is
        # what cargo-mutants builds, so tylertoo-core's tests compile once
        # more here under that feature set (a few minutes on the warm
        # dependency cache); feature-gated test binaries must not leak
        # into the mutation list.
        if: runner.os == 'Linux' && matrix.rust == 'stable'
        run: scripts/mutants-test-binaries.sh --check

      # Main only; see CACHES in the header.
      - name: Save cargo build cache
        if: always() && github.ref == 'refs/heads/main' && matrix.rust == 'stable' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  # Slow Tests: the slow set, split three ways per OS.
  #
  # What runs: the slow end-to-end tests that the `quick` nextest profile
  # excludes, selected with `not default()` against the `default-filter` in
  # .config/nextest.toml (#457). `quick` (the Test job) plus this set equal
  # the `full` profile. They run beside the Test matrix, so no other job
  # waits on them (#524). Stable only, on both OSes: the set holds the
  # determinism and shard-parity tests, which guard platform-sensitive
  # behavior. PRs run ubuntu only; every push to main adds macOS, so a
  # macOS-only break surfaces on the merge that caused it (the plan job
  # builds the matrix; see "WHAT RUNS WHEN" in the header).
  #
  # Shards: the set is CPU-bound (about 2700 test-seconds against a 4-vCPU
  # runner; a single runner took 13-17 min), so it is split three ways by
  # test binary, balanced on measured test-seconds (ubuntu, Oct 2026):
  #   heavy        sink_downgrade (one 568s test, the floor for any split),
  #                hostile_geometry_eval, stream_profile_parity   ~825s
  #   determinism  thread_count_determinism                        ~860s
  #   rest         everything else in the slow set                ~1000s
  # `rest` is defined as "not the other two", so a new slow binary lands
  # there with no edit here. (`--partition count:N/3` dealt tests out one at
  # a time and put 1850 of the 2700 test-seconds in shard 1.) Rebalance by
  # moving a binary between the two named filters below.
  #
  # The golden-tile guard (`convert_guard_golden`, #558) lives in this set,
  # in `rest`, and gates merges through `CI passed`. If Slow Tests ever drops
  # out of that job's `needs`, the guard stops gating.
  slow-tests:
    name: Slow Tests (${{ matrix.os }}, ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.slow_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata/*.parquet
          key: fixtures-v1-${{ runner.os }}-${{ hashFiles('tests/fixtures/realdata/*.parquet') }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        # Same key as the Test (<os>, stable) lane: same build, so this job
        # starts from a warm target/ and compiles almost nothing.
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-stable-cargo-build-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-stable-cargo-build-target-

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest

      # leaf_directory_integration runs `pmtiles verify` on its archives and
      # fails on CI when the CLI is missing (#779; it passed vacuously
      # before). The pinned, checksummed go-pmtiles that e2e.yml uses.
      - name: Install go-pmtiles (pinned, checksummed)
        run: |
          scripts/setup_go_pmtiles.sh
          eval "$(scripts/setup_go_pmtiles.sh --print-path)"
          echo "PMTILES_BIN=$PMTILES_BIN" >> "$GITHUB_ENV"

      - name: Run slow tests (${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          heavy='binary(sink_downgrade) | binary(hostile_geometry_eval) | binary(stream_profile_parity)'
          determinism='binary(thread_count_determinism)'
          case "$SHARD" in
            heavy) shard="$heavy" ;;
            determinism) shard="$determinism" ;;
            rest) shard="not ($heavy | $determinism)" ;;
            *) echo "::error::unknown shard $SHARD"; exit 1 ;;
          esac
          cargo nextest run --locked --all-features \
            --ignore-default-filter -E "not default() & ($shard)"

      # Main only; see CACHES in the header.
      - name: Save cargo build cache
        if: always() && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  # Python bindings: strict lint/type/dead-code/complexity/security gates.
  # Everything runs through uv against the committed uv.lock.
  python-quality:
    name: Python Quality
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # maturin builds the extension with [profile.ci] (Cargo.toml).
      MATURIN_PEP517_ARGS: --profile ci
    defaults:
      run:
        working-directory: crates/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo (pyo3 build)
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-python-

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: crates/python/uv.lock

      # The pytest step's integration tests read tests/fixtures/realdata.
      # Those files are git-LFS pointers in a plain checkout (checkout
      # doesn't fetch LFS), which exist but are not parquet — so the tests'
      # skipif guards pass and every conversion fails on "Corrupt footer".
      # Same cache + release-download pattern as the Rust jobs.
      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata/*.parquet
          key: fixtures-v1-${{ runner.os }}-${{ hashFiles('tests/fixtures/realdata/*.parquet') }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        # This job sets defaults.run.working-directory: crates/python, but
        # the cache step above (and the tests themselves) use the repo-root
        # tests/fixtures/realdata. Override back to the workspace root so
        # the download lands in the same place the cache step reads/writes.
        working-directory: ${{ github.workspace }}
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sync environment (builds the extension module)
        run: uv sync --locked

      - name: ruff check (strict ruleset)
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

      - name: stubtest (_tylertoo.pyi matches the built extension)
        run: uv run python -m mypy.stubtest tylertoo --allowlist stubtest-allowlist.txt

      - name: ty (the package and the extension stub)
        run: uv run --no-sync ty check python

      # The docstring examples, run against a small committed fixture
      # (python/conftest.py).
      - name: doctests
        run: uv run --no-sync pytest --doctest-modules python -v

      # The binding's own test suite (#418): kwarg-surface tests plus the
      # integration classes against the downloaded fixtures. 88 tests, <1s
      # once the extension is built.
      - name: pytest
        run: uv run --no-sync pytest tests/ -v

      - name: vulture (dead code)
        run: uv run vulture

      - name: xenon (complexity gate)
        # Max absolute grade C: two golden-report tests rank C today.
        # Current complexity limit for Python functions.
        run: uv run xenon --max-absolute C --max-modules A --max-average A tests

      - name: pip-audit (uv lockfile)
        run: |
          uv export --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --disable-pip

      # Main only; see CACHES in the header.
      - name: Save cargo cache (pyo3 build)
        if: always() && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The binding's pytest suite on the other two wheel platforms (#678).
  # Release builds macOS and Windows wheels but only import-checks them;
  # this runs the Python API on both before merge. Python Quality keeps the
  # lint/type/audit steps, which do not depend on the OS, on Linux only.
  python-tests:
    name: Python Tests (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # maturin builds the extension with [profile.ci] (Cargo.toml).
      MATURIN_PEP517_ARGS: --profile ci
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        # bash on every OS: Windows defaults to pwsh, where the bash syntax
        # below fails or means something else.
        shell: bash
        working-directory: crates/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-protoc-windows

      - name: Cache cargo (pyo3 build)
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-python-

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: crates/python/uv.lock

      # Same fixture cache + release download as Python Quality; see the
      # note there on git-LFS pointers.
      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata/*.parquet
          key: fixtures-v1-${{ runner.os }}-${{ hashFiles('tests/fixtures/realdata/*.parquet') }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sync environment (builds the extension module)
        run: uv sync --locked

      - name: pytest
        run: uv run --no-sync pytest tests/ -v

      # Main only; see CACHES in the header.
      - name: Save cargo cache (pyo3 build)
        if: always() && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Docs: the reference pages, the rustdoc, and every example the site shows.
  #
  # - The CLI and Python reference pages are generated from the clap help
  #   strings (hidden gen-docs feature) and the docstrings in
  #   crates/python/python/tylertoo/__init__.py, committed
  #   under docs/reference/, and must match a fresh regeneration.
  # - rustdoc builds with -D warnings, so docs.rs never shows a broken link.
  # - crates/python/tests/docs runs both tutorials (examples/*) and the
  #   README quickstart against the CLI ([profile.ci]), checks every command the
  #   guides show against `--help`, and builds the site with
  #   `zensical build --strict`. See tests/docs/conftest.py for the policy.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The docs dependency group (zensical, gpio) needs Python >= 3.11.
      UV_PYTHON: "3.12"
      # The extension and the CLI build with [profile.ci] (Cargo.toml).
      MATURIN_PEP517_ARGS: --profile ci
      TYLERTOO_BIN: ${{ github.workspace }}/target/ci/tylertoo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-docs-

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: crates/python/uv.lock

      # The tutorials run on the Madagascar fixture. A plain checkout holds
      # only its LFS pointer, so fetch the real file from the release.
      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata/*.parquet
          key: fixtures-v1-${{ runner.os }}-${{ hashFiles('tests/fixtures/realdata/*.parquet') }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Regenerate CLI reference
        run: |
          cargo run --locked -p tylertoo --features gen-docs -- gen-reference-docs \
            > docs/reference/cli.md

      - name: Build extension and regenerate Python reference
        working-directory: crates/python
        run: |
          uv sync --locked --group docs
          uv run --no-sync --with docstring-parser==0.18.0 \
            python scripts/gen_reference.py > ../../docs/reference/python.md

      - name: Fail if reference docs drifted
        run: |
          if ! git diff --exit-code -- docs/reference/cli.md docs/reference/python.md; then
            echo "::error::Reference docs are stale — regenerate and commit:"
            echo "  cargo run -p tylertoo --features gen-docs -- gen-reference-docs > docs/reference/cli.md"
            echo "  cd crates/python && uv run --no-sync --with docstring-parser==0.18.0 python scripts/gen_reference.py > ../../docs/reference/python.md"
            exit 1
          fi

      - name: rustdoc (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps -p tylertoo-core --features remote

      - name: Build the CLI
        run: cargo build --locked --profile ci -p tylertoo

      - name: Test documentation examples and site build
        working-directory: crates/python
        run: uv run --no-sync pytest -m docs tests/docs -v

      # Main only; see CACHES in the header.
      - name: Save cargo cache
        if: always() && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Coverage reporting
  coverage:
    name: Coverage
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata/*.parquet
          key: fixtures-v1-${{ runner.os }}-${{ hashFiles('tests/fixtures/realdata/*.parquet') }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        # Own key: llvm-cov builds into target/llvm-cov-target with
        # instrumentation flags, so the Test job's cache does not help.
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-llvm-cov-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-llvm-cov-target-

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install cargo-llvm-cov and cargo-nextest
        # Prebuilt binaries via install-action; compiling them from source
        # costs minutes on every run.
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # The tippecanoe-decode golden comparison in decode_roundtrip.rs is a
      # hard failure on CI when the binary is missing (#420; it skipped
      # silently before, so it had never run here). Pinned tag + commit SHA,
      # built into .tools/ and cached on the setup script's hash - the same
      # build tippecanoe-compare.yml gates against.
      - name: Install tippecanoe build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libsqlite3-dev zlib1g-dev

      - name: Cache tippecanoe
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/tippecanoe-*
            .tools/src-*
          key: tippecanoe-${{ hashFiles('benchmarks/e2e/setup_tippecanoe.sh') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build tippecanoe (pinned tag + SHA) and put it on PATH
        run: |
          benchmarks/e2e/setup_tippecanoe.sh
          eval "$(benchmarks/e2e/setup_tippecanoe.sh --print-path)"
          dirname "$TIPPECANOE_BIN" >> "$GITHUB_PATH"

      - name: Generate coverage
        # Source-based instrumentation (#524). tarpaulin ran the suite under
        # ptrace and needed --timeout 300 for the #460 determinism e2e; it
        # was the CI long pole at ~11 min. llvm-cov also counts the CLI
        # subprocesses those e2e tests spawn, which tarpaulin could not.
        # nextest runs every test from every binary in parallel; cargo test
        # runs the test binaries one after another.
        run: >-
          cargo llvm-cov nextest --all-features --workspace
          --exclude tylertoo-python
          --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      # Main only; see CACHES in the header.
      - name: Save cargo build cache
        if: always() && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.build-cache.outputs.cache-primary-key }}


  # Lint: the small checks on one runner. Each used to be its own job, and
  # on the free plan's 20-job pool a job that runs for seconds still waits
  # its turn for a runner. Every check step runs `if: !cancelled()`, so one
  # failure does not hide the next; the failing step's name says which
  # check it was.
  lint:
    name: Lint
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public API's pinned nightly: see the TOOLCHAIN EXCEPTION note there.
      NIGHTLY: nightly-2026-09-15
      VALE_VERSION: "3.24.0"
      VALE_SHA256: 867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version fields stay in sync across the workspace. MUST pass before
      # any release.
      - name: Version consistency
        if: ${{ !cancelled() }}
        run: |
          echo "Checking version consistency across workspace..."

          # Extract versions
          WORKSPACE_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          CORE_DEP_VERSION=$(grep 'tylertoo-core.*version' Cargo.toml | sed 's/.*version = "\([^"]*\)".*/\1/')
          PYTHON_VERSION=$(grep -m1 '^version = ' crates/python/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          CZ_VERSION=$(grep '^version = ' .cz.toml | sed 's/version = "\(.*\)"/\1/')
          # uv.lock pins the Python project's own version. `cz bump` does not
          # touch it, and a stale pin fails the Python Quality job later with
          # an opaque resolver error, so check it here where the fix is named.
          UV_LOCK_VERSION=$(awk '/^name = "tylertoo"$/ { getline; sub(/^version = "/, ""); sub(/"$/, ""); print; exit }' crates/python/uv.lock)

          echo "Versions found:"
          echo "  Cargo.toml workspace.package.version: $WORKSPACE_VERSION"
          echo "  Cargo.toml tylertoo-core dependency: $CORE_DEP_VERSION"
          echo "  pyproject.toml version:               $PYTHON_VERSION"
          echo "  .cz.toml version:                     $CZ_VERSION"
          echo "  crates/python/uv.lock version:        $UV_LOCK_VERSION"

          # Check for mismatches
          ERROR=0
          if [ "$WORKSPACE_VERSION" != "$CORE_DEP_VERSION" ]; then
            echo "::error::Version mismatch: workspace=$WORKSPACE_VERSION vs core-dep=$CORE_DEP_VERSION"
            ERROR=1
          fi
          if [ "$WORKSPACE_VERSION" != "$PYTHON_VERSION" ]; then
            echo "::error::Version mismatch: workspace=$WORKSPACE_VERSION vs python=$PYTHON_VERSION"
            ERROR=1
          fi
          if [ "$WORKSPACE_VERSION" != "$CZ_VERSION" ]; then
            echo "::error::Version mismatch: workspace=$WORKSPACE_VERSION vs commitizen=$CZ_VERSION"
            ERROR=1
          fi
          if [ "$WORKSPACE_VERSION" != "$UV_LOCK_VERSION" ]; then
            echo "::error::Version mismatch: workspace=$WORKSPACE_VERSION vs uv.lock=$UV_LOCK_VERSION. Run 'cd crates/python && uv lock'."
            ERROR=1
          fi

          if [ "$ERROR" -eq 1 ]; then
            echo ""
            echo "Fix: Run 'uv run cz bump' from repo root to sync all versions,"
            echo "     then 'cd crates/python && uv lock' to refresh the lockfile."
            exit 1
          fi

          echo "All versions consistent: $WORKSPACE_VERSION"

      - name: Install uv
        if: ${{ !cancelled() }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # CI Lint: zizmor (GitHub Actions security linter) on these workflows.
      - name: zizmor
        if: ${{ !cancelled() }}
        run: uvx zizmor==1.26.1 --min-severity low .github/workflows .github/actions
        env:
          GH_TOKEN: ${{ github.token }}

      # Docs Prose: scripts/lint-prose.sh owns the file list and is the same
      # command the pre-commit hook runs: Vale errors and any proselint
      # finding fail the step. Vale's warnings and suggestions print
      # afterwards as an advisory audit that never fails.
      - name: Install Vale
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}
        run: |
          gh release download "v${VALE_VERSION}" --repo vale-cli/vale \
            --pattern "vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            --output vale.tar.gz
          echo "${VALE_SHA256}  vale.tar.gz" | sha256sum --check
          tar xzf vale.tar.gz vale
          sudo install -m 0755 vale /usr/local/bin/vale
          vale --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch the pinned Vale packages
        if: ${{ !cancelled() }}
        run: vale sync

      - name: Test the Tylertoo-* Vale rules
        if: ${{ !cancelled() }}
        run: |
          vale test --coverage .vale/tests \
            .vale/styles/Tylertoo-Docs .vale/styles/Tylertoo-Mechanics \
            .vale/styles/Tylertoo-Terms .vale/styles/Tylertoo-Voice

      - name: Lint docs prose (Vale errors + proselint)
        if: ${{ !cancelled() }}
        run: scripts/lint-prose.sh

      - name: Vale advisory audit (warnings and suggestions)
        if: ${{ !cancelled() }}
        run: |
          scripts/lint-prose.sh --list \
            | xargs vale --no-exit --minAlertLevel=suggestion --output=line

      # Three toolchains below: the declared MSRV, Public API's pinned
      # nightly, and stable. dtolnay/rust-toolchain makes the last one it
      # installs the default, so stable goes last and the other two are
      # always named with `cargo +<toolchain>`.
      #
      # MSRV: the `rust-version` in Cargo.toml is a published compatibility
      # promise, and nothing else in CI exercises it -- stable and beta both
      # satisfy any plausible value -- so it silently rotted to "1.75" while
      # the real floor had moved to 1.95. The toolchain is read FROM
      # Cargo.toml rather than pinned here, so the two cannot disagree: bump
      # the manifest and this check follows.
      - name: Read MSRV from Cargo.toml
        id: msrv
        if: ${{ !cancelled() && needs.plan.outputs.rust == 'true' }}
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::could not read rust-version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $version"

      - name: Install Rust ${{ steps.msrv.outputs.version }} (MSRV)
        if: ${{ !cancelled() && needs.plan.outputs.rust == 'true' }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Install Rust nightly (Public API)
        # cargo-public-api reads rustdoc JSON, which is nightly-only.
        if: ${{ !cancelled() && needs.plan.outputs.rust == 'true' }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.NIGHTLY }}

      - name: Install Rust stable
        if: ${{ !cancelled() }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install protoc
        if: ${{ !cancelled() && needs.plan.outputs.rust == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      # Security audit: advisories on every PR, plus full supply-chain policy
      # (licenses, bans, sources) via cargo-deny. The weekly security.yml run
      # catches new advisories between PRs.
      - name: Install cargo-audit and cargo-deny
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit,cargo-deny

      # Cargo.lock is committed, so there is nothing to generate here: the
      # audits below run against the exact versions we build and ship. This
      # step only fails if the lock is stale relative to the manifests,
      # instead of letting the audit silently re-resolve. (The weekly
      # security.yml run keeps auditing a *fresh* resolution as the
      # early-warning lane — see the comment on that step.)
      - name: Verify Cargo.lock is up to date
        if: ${{ !cancelled() }}
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Run cargo audit
        if: ${{ !cancelled() }}
        run: cargo audit

      - name: Run cargo deny (advisories, licenses, bans, sources)
        if: ${{ !cancelled() }}
        run: cargo deny check

      # SEMVER GATE DISABLED until the v0.9 "freeze" milestone (#436/#437).
      #
      # The old gate ran with `--baseline-rev origin/main`, which compares
      # each PR against main, not against the last release. Every PR that
      # broke tylertoo-core's public API then needed its own minor bump,
      # even when the previous bump was still unreleased, so the version
      # climbed from 0.7.1 to 0.11.0 with no releases behind it and had to
      # be reset to 0.8.0 by hand.
      #
      # Re-enable when the v0.9 API freeze lands: add cargo-semver-checks
      # to the install step above and restore this step. Leave out
      # `--baseline-rev`: without it the tool compares against the newest
      # tylertoo-core on crates.io, so one bump covers every breaking change
      # until the next release.
      #
      #   - name: Check for breaking API changes
      #     run: |
      #       cargo semver-checks check-release \
      #         --package tylertoo-core
      #
      # The committed public-api baseline step below stays: API changes are
      # still surfaced in review via api/tylertoo-core.txt diffs — they just
      # no longer force a version bump.

      # --all-features so the optional `remote` stack (object_store, aws-*) is
      # covered too; that is where the MSRV floor actually comes from.
      - name: Check on the declared MSRV
        if: ${{ !cancelled() && needs.plan.outputs.rust == 'true' }}
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check --locked --workspace --all-targets --all-features

      # Public API surface: fail when core's or io's exported API drifts from
      # the committed baseline. This is a REVIEW gate, not a ban on growth —
      # an intentional change is landed by regenerating the baseline in the
      # same PR:
      #
      #   cd crates/core
      #   rustup toolchain install $NIGHTLY   # the pin above
      #   cargo +$NIGHTLY public-api --simplified > api/tylertoo-core.txt
      #
      # TOOLCHAIN EXCEPTION: this is the one check with a pinned toolchain.
      # The workspace policy is floating `stable` (see the header), but the
      # baseline is rustdoc JSON, and rustdoc renders paths differently from
      # one nightly to the next. A floating `nightly` broke this gate with no
      # source change when `std::io::Error` started printing as
      # `core::io::error::Error`. The pin makes the diff mean "the API
      # changed", not "rustc changed". Bump it deliberately, regenerating
      # the baseline in the same commit.
      - name: Install cargo-public-api
        if: ${{ !cancelled() && needs.plan.outputs.rust == 'true' }}
        run: cargo install cargo-public-api --locked

      - name: Diff the public API against the baseline
        if: ${{ !cancelled() && needs.plan.outputs.rust == 'true' }}
        run: |
          for crate in core io; do
            (
              cd "crates/$crate"
              cargo "+$NIGHTLY" public-api --simplified > api-current.txt
              if ! diff -u "api/tylertoo-$crate.txt" api-current.txt; then
                echo "::error::tylertoo-$crate public API changed."
                echo "Regenerate the baseline in this PR if the change is intended:"
                echo "  cd crates/$crate && cargo +$NIGHTLY public-api \\"
                echo "    --simplified > api/tylertoo-$crate.txt"
                exit 1
              fi
            ) || exit 1
          done

  # Independent archive-verifier regression tests; one scripts/ci pytest step.
  gate-scripts:
    name: Gate scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Test the archive verifier
        run: >-
          uv run --no-project --with pytest==8.4.2 --with pmtiles==3.8.1
          --with mapbox-vector-tile==2.2.0 --with shapely==2.2.0 --with pyarrow==26.0.0
          pytest -q scripts/ci/tests

  mutation-diff:
    name: Mutation gate
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.code == 'true'
    uses: ./.github/workflows/mutation-diff.yml

  # The one CI context branch protection requires. Every job above is
  # blocking through it: it fails when any of them failed or was cancelled.
  # "skipped" passes, because the plan job skips jobs on purpose (docs-only
  # PRs; the main-only lanes). A new job must be added to `needs` here or
  # it does not gate anything.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - plan
      - lint
      - check
      - test
      - slow-tests
      - python-quality
      - python-tests
      - docs
      - coverage
      - gate-scripts
      - mutation-diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::a required CI job failed or was cancelled (listed above)"
            exit 1
          fi
