# CI — the PR quality gates.
#
# Purpose: every job here is a *blocking* check for PRs into main. Humans only
# review what machines can't check; everything below is machine-checked:
#   version-check   version fields stay in sync across the workspace
#   Check           rustfmt, clippy (-D warnings + curated lint set in
#                   Cargo.toml [workspace.lints]), cargo-machete, unit tests
#   Test            full test matrix (ubuntu/macos x stable/beta)
#   Python Quality  ruff check/format, mypy + stubtest, vulture, xenon,
#                   pip-audit — all via uv against the committed lockfile
#   Reference Docs  the committed CLI + Python reference (docs/reference/)
#                   still match regeneration from source (clap help strings +
#                   pyo3 docstrings); fails on drift
#   Coverage        cargo-llvm-cov -> lcov -> codecov (informational)
#   Profiling       dhat-heap feature keeps compiling
#   Security Audit  cargo-audit + cargo-deny (advisories/licenses/bans/sources)
#   CI Lint         zizmor (GitHub Actions security linter) on this repo's
#                   own workflows
#
# Benchmarks run in bench.yml (push to main / manual); mutation testing runs
# in mutation-tests.yml (weekly). Neither appears here, so no job in this
# workflow is ever skipped on a PR.
#
# TOOLCHAIN POLICY: floating `stable` for all gates, with a `beta` lane in the
# Test matrix as the early-warning system for upcoming rustc/clippy breakage
# (a new stable clippy once cost a morning — beta surfaces that a cycle
# early). We deliberately do NOT pin the toolchain: a pin needs a scheduled
# bump job that itself rots, while beta failures are visible and actionable.
# All third-party actions are pinned by commit SHA (enforced by zizmor);
# Dependabot bumps the pins.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same PR to keep the feedback loop short.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Version consistency check - MUST pass before any release
  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version consistency
        run: |
          echo "Checking version consistency across workspace..."

          # Extract versions
          WORKSPACE_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          CORE_DEP_VERSION=$(grep 'tylertoo-core.*version' Cargo.toml | sed 's/.*version = "\([^"]*\)".*/\1/')
          PYTHON_VERSION=$(grep -m1 '^version = ' crates/python/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          CZ_VERSION=$(grep '^version = ' .cz.toml | sed 's/version = "\(.*\)"/\1/')
          # uv.lock pins the Python project's own version. `cz bump` does not
          # touch it, and a stale pin fails the Python Quality job later with
          # an opaque resolver error, so check it here where the fix is named.
          UV_LOCK_VERSION=$(awk '/^name = "tylertoo"$/ { getline; sub(/^version = "/, ""); sub(/"$/, ""); print; exit }' crates/python/uv.lock)

          echo "Versions found:"
          echo "  Cargo.toml workspace.package.version: $WORKSPACE_VERSION"
          echo "  Cargo.toml tylertoo-core dependency: $CORE_DEP_VERSION"
          echo "  pyproject.toml version:               $PYTHON_VERSION"
          echo "  .cz.toml version:                     $CZ_VERSION"
          echo "  crates/python/uv.lock version:        $UV_LOCK_VERSION"

          # Check for mismatches
          ERROR=0
          if [ "$WORKSPACE_VERSION" != "$CORE_DEP_VERSION" ]; then
            echo "::error::Version mismatch: workspace=$WORKSPACE_VERSION vs core-dep=$CORE_DEP_VERSION"
            ERROR=1
          fi
          if [ "$WORKSPACE_VERSION" != "$PYTHON_VERSION" ]; then
            echo "::error::Version mismatch: workspace=$WORKSPACE_VERSION vs python=$PYTHON_VERSION"
            ERROR=1
          fi
          if [ "$WORKSPACE_VERSION" != "$CZ_VERSION" ]; then
            echo "::error::Version mismatch: workspace=$WORKSPACE_VERSION vs commitizen=$CZ_VERSION"
            ERROR=1
          fi
          if [ "$WORKSPACE_VERSION" != "$UV_LOCK_VERSION" ]; then
            echo "::error::Version mismatch: workspace=$WORKSPACE_VERSION vs uv.lock=$UV_LOCK_VERSION. Run 'cd crates/python && uv lock'."
            ERROR=1
          fi

          if [ "$ERROR" -eq 1 ]; then
            echo ""
            echo "Fix: Run 'uv run cz bump' from repo root to sync all versions,"
            echo "     then 'cd crates/python && uv lock' to refresh the lockfile."
            exit 1
          fi

          echo "All versions consistent: $WORKSPACE_VERSION"

  # Fast feedback: formatting, lints, dead deps, unit tests
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata
          key: fixtures-v1-${{ runner.os }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install cargo-shear
        uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: cargo-shear

      # The musl release binary carries a musl-only #[global_allocator]
      # (#480) that no other job compiles. cargo check needs no musl linker,
      # so this catches cfg mistakes (e.g. clashing with the dhat-heap
      # allocator) without a full cross build.
      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install similarity-rs
        run: cargo install similarity-rs --locked

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        # -D warnings also denies the curated [workspace.lints.clippy] set
        # (pedantic subset + cognitive_complexity) defined in Cargo.toml.
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check musl target compiles (both allocator arrangements)
        # The CLI's musl-only #[global_allocator] (#480) must coexist with
        # the dhat-heap allocator cfg; neither combination is compiled by
        # any other job. musl-tools provides musl-gcc for the -sys crates'
        # C code (zstd, mimalloc).
        run: |
          sudo apt-get install -y musl-tools
          cargo check --locked --target x86_64-unknown-linux-musl -p tylertoo
          cargo check --locked --target x86_64-unknown-linux-musl -p tylertoo --features dhat-heap

      - name: Check for unused dependencies
        # cargo-shear, not cargo-machete: it also inspects
        # [workspace.dependencies], where machete only reads member crates.
        # Intentional non-code deps are listed under
        # [package.metadata.cargo-shear] in the owning crate.
        run: cargo shear

      - name: Check for duplicated code
        # Hard gate at 0.95 APTED similarity. The workspace has zero pairs at
        # or above this threshold. similarity-rs has no baseline or per-pair
        # suppression, so a new finding must be refactored, not annotated.
        # RATCHET: lower the threshold as duplication drops — never raise it.
        run: |
          similarity-rs \
            --threshold 0.95 \
            --min-lines 10 \
            --skip-test \
            crates/core/src crates/cli/src crates/python/src \
            | tee similarity.txt
          if grep -q "Similarity:" similarity.txt; then
            echo "::error::duplicate code found at >=0.95 similarity"
            exit 1
          fi

      - name: Run unit tests
        run: cargo test --locked --lib --all-features

  # Full test suite
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata
          key: fixtures-v1-${{ runner.os }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-build-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install cargo-nextest
        uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: cargo-nextest

      - name: Run all tests (excluding slow regression tests)
        # Large polygon regression tests are run manually - see tests/fixtures/realdata/README.md
        # nextest runs every test from every binary in parallel.
        run: >-
          cargo nextest run --locked --all-features
          -E 'not test(large_polygon_regression)'

      - name: Run doctests
        # nextest does not run doctests.
        run: cargo test --locked --all-features --doc

  # Python bindings: strict lint/type/dead-code/complexity/security gates.
  # Everything runs through uv against the committed uv.lock.
  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo (pyo3 build)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: crates/python/uv.lock

      # The pytest step's integration tests read tests/fixtures/realdata.
      # Those files are git-LFS pointers in a plain checkout (checkout
      # doesn't fetch LFS), which exist but are not parquet — so the tests'
      # skipif guards pass and every conversion fails on "Corrupt footer".
      # Same cache + release-download pattern as the Rust jobs.
      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata
          key: fixtures-v1-${{ runner.os }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        # This job sets defaults.run.working-directory: crates/python, but
        # the cache step above (and the tests themselves) use the repo-root
        # tests/fixtures/realdata. Override back to the workspace root so
        # the download lands in the same place the cache step reads/writes.
        working-directory: ${{ github.workspace }}
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sync environment (builds the extension module)
        run: uv sync --locked

      - name: ruff check (strict ruleset)
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

      - name: stubtest (tylertoo.pyi matches the built module)
        run: uv run python -m mypy.stubtest tylertoo --allowlist stubtest-allowlist.txt

      # The binding's own test suite (#418): kwarg-surface tests plus the
      # integration classes against the downloaded fixtures. 88 tests, <1s
      # once the extension is built.
      - name: pytest
        run: uv run --no-sync pytest tests/ -v

      - name: vulture (dead code)
        run: uv run vulture

      - name: xenon (complexity gate)
        # Max absolute grade C: two golden-report tests rank C today.
        # RATCHET: tighten to B once they are split up — never loosen.
        run: uv run xenon --max-absolute C --max-modules A --max-average A tests

      - name: pip-audit (uv lockfile)
        run: |
          uv export --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --disable-pip

  # Generated reference docs stay in sync with source. The CLI reference is
  # rendered from the clap help strings (via the hidden gen-docs feature) and
  # the Python reference from the pyo3 docstrings on the compiled module. Both
  # are committed under docs/reference/; this job regenerates them and
  # fails if the committed copies drift, so the source doc-comments remain the
  # single source of truth.
  reference-docs:
    name: Reference Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-reference-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: crates/python/uv.lock

      - name: Regenerate CLI reference
        run: |
          cargo run --locked -p tylertoo --features gen-docs -- gen-reference-docs \
            > docs/reference/cli.md

      - name: Build extension and regenerate Python reference
        working-directory: crates/python
        run: |
          uv sync --locked
          uv run --no-sync --with docstring-parser==0.18.0 \
            python scripts/gen_reference.py > ../../docs/reference/python.md

      - name: Fail if reference docs drifted
        run: |
          if ! git diff --exit-code -- docs/reference/cli.md docs/reference/python.md; then
            echo "::error::Reference docs are stale — regenerate and commit:"
            echo "  cargo run -p tylertoo --features gen-docs -- gen-reference-docs > docs/reference/cli.md"
            echo "  cd crates/python && uv run --no-sync --with docstring-parser==0.18.0 python scripts/gen_reference.py > ../../docs/reference/python.md"
            exit 1
          fi

  # Coverage reporting
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata
          key: fixtures-v1-${{ runner.os }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        # Own key: llvm-cov builds into target/llvm-cov-target with
        # instrumentation flags, so the Test job's cache does not help.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-llvm-cov-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install cargo-llvm-cov and cargo-nextest
        # Prebuilt binaries via install-action; compiling them from source
        # costs minutes on every run.
        uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Generate coverage
        # Source-based instrumentation (#524). tarpaulin ran the suite under
        # ptrace and needed --timeout 300 for the #460 determinism e2e; it
        # was the CI long pole at ~11 min. llvm-cov also counts the CLI
        # subprocesses those e2e tests spawn, which tarpaulin could not.
        # nextest runs every test from every binary in parallel; cargo test
        # runs the test binaries one after another.
        run: >-
          cargo llvm-cov nextest --all-features --workspace
          --exclude tylertoo-python
          --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false  # Don't fail if token not configured

  # Profiling features compile check
  profiling:
    name: Profiling Features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-profiling-${{ hashFiles('**/Cargo.lock') }}

      - name: Build with dhat-heap feature
        run: cargo build --locked --release --features dhat-heap

  # Build on exactly the declared MSRV. The `rust-version` in Cargo.toml is a
  # published compatibility promise, and nothing else in CI exercises it --
  # stable and beta both satisfy any plausible value -- so it silently rotted
  # to "1.75" while the real floor had moved to 1.95. The toolchain is read
  # FROM Cargo.toml rather than pinned here, so the two cannot disagree: bump
  # the manifest and this job follows.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::could not read rust-version from Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $version"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}

      # --all-features so the optional `remote` stack (object_store, aws-*) is
      # covered too; that is where the MSRV floor actually comes from.
      - name: Check on the declared MSRV
        run: cargo check --locked --workspace --all-targets --all-features

  # Security audit: advisories on every PR, plus full supply-chain policy
  # (licenses, bans, sources) via cargo-deny. The weekly security.yml run
  # catches new advisories between PRs.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history kept: the (currently disabled, see below) semver
          # gate resolves its baseline from a git revision.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: cargo-audit,cargo-deny

      # Cargo.lock is committed, so there is nothing to generate here: the
      # audits below run against the exact versions we build and ship. This
      # step only fails the job if the lock is stale relative to the
      # manifests, instead of letting the audit silently re-resolve.
      # (The weekly security.yml run keeps auditing a *fresh* resolution as
      # the early-warning lane — see the comment on that step.)
      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Run cargo audit
        run: cargo audit

      - name: Run cargo deny (advisories, licenses, bans, sources)
        run: cargo deny check

      # SEMVER GATE DISABLED until the v0.9 "freeze" milestone (#436/#437).
      #
      # cargo-semver-checks (vs --baseline-rev origin/main) required a
      # version bump in every PR that broke tylertoo-core's public API.
      # Pre-freeze, the public surface is deliberately still in flux
      # (#437 shrinks it; #436 makes it evolvable), so the gate forced a
      # hand-bump per breaking PR and marched the workspace version from
      # 0.8 to 0.12 with no releases behind it — more pain than value.
      # Re-enable when the v0.9 API freeze lands: restore the
      # cargo-semver-checks tool in the install step above and this step:
      #
      #   - name: Check for breaking API changes
      #     run: |
      #       cargo semver-checks check-release \
      #         --package tylertoo-core \
      #         --baseline-rev origin/main
      #
      # The committed public-api baseline job below stays: API changes are
      # still surfaced in review via api/tylertoo-core.txt diffs — they just
      # no longer force a version bump.

  # Public API surface: fail when tylertoo-core's exported API drifts from the
  # committed baseline. This is a REVIEW gate, not a ban on growth — an
  # intentional change is landed by regenerating the baseline in the same PR:
  #
  #   cd crates/core
  #   rustup toolchain install $NIGHTLY   # the pin below
  #   cargo +$NIGHTLY public-api --simplified > api/tylertoo-core.txt
  #
  # TOOLCHAIN EXCEPTION: this is the one job with a pinned toolchain. The
  # workspace policy is floating `stable` (see the header), but the baseline
  # is rustdoc JSON, and rustdoc renders paths differently from one nightly
  # to the next. A floating `nightly` broke this gate with no source change
  # when `std::io::Error` started printing as `core::io::error::Error`. The
  # pin makes the diff mean "the API changed", not "rustc changed". Bump it
  # deliberately, regenerating the baseline in the same commit.
  public-api:
    name: Public API
    runs-on: ubuntu-latest
    env:
      NIGHTLY: nightly-2026-09-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        # cargo-public-api reads rustdoc JSON, which is nightly-only.
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.NIGHTLY }}

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked

      - name: Diff the public API against the baseline
        run: |
          cargo "+$NIGHTLY" public-api --simplified > api-current.txt
          if ! diff -u api/tylertoo-core.txt api-current.txt; then
            echo "::error::tylertoo-core public API changed."
            echo "Regenerate the baseline in this PR if the change is intended:"
            echo "  cd crates/core && cargo +$NIGHTLY public-api \\"
            echo "    --simplified > api/tylertoo-core.txt"
            exit 1
          fi
        working-directory: crates/core

  # Lint the CI configuration itself.
  ci-lint:
    name: CI Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run zizmor
        run: uvx zizmor==1.26.1 --min-severity low .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
