# TEMPORARY: proves the manylinux aarch64 wheel step of release.yml on an
# arm64 runner before the v0.9.2 release. Delete before merge.
name: tmp aarch64 wheel

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tmp-aarch64-wheel.yml

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Build wheel (same inputs as release.yml)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: aarch64
          manylinux: auto
          args: --release --locked --out dist -m crates/python/Cargo.toml
          before-script-linux: |
            if ! command -v unzip >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update && apt-get install -y unzip
              elif command -v dnf >/dev/null 2>&1; then
                dnf install -y unzip
              elif command -v yum >/dev/null 2>&1; then
                yum install -y unzip
              elif command -v apk >/dev/null 2>&1; then
                apk add --no-cache unzip
              fi
            fi
            case "$(uname -m)" in
              aarch64) PROTOC_ZIP=protoc-25.1-linux-aarch_64.zip ;;
              *) PROTOC_ZIP=protoc-25.1-linux-x86_64.zip ;;
            esac
            curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v25.1/$PROTOC_ZIP"
            unzip -o "$PROTOC_ZIP" -d /usr/local
            rm "$PROTOC_ZIP"

      - name: Install and import the wheel
        run: |
          ls -l dist
          python -m pip install dist/*.whl
          python -c "import tylertoo; print(tylertoo.__version__ if hasattr(tylertoo, '__version__') else 'imported')"
          python -m tylertoo --version
