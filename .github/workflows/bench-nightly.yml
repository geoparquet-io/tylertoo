# Nightly regression checks on GitHub-hosted runners.

name: Bench nightly

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      record_baseline:
        description: Record a baseline artifact for the maintainer to commit
        type: boolean
        default: false

concurrency:
  group: bench-nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SRC_792_URL: https://geodaten.bayern.de/odd/m/3/daten/hausumringe/bezirk/data/092_Niederbayern_Hausumringe.zip
  SRC_792_SHA256: 6007be46c1a0cda43604a71139a735c0fa8920048cba85dc19182dc13d835d4c
  MOLDOVA_URL: https://github.com/geoparquet-io/tylertoo/releases/download/bench-coalesce-v1/moldova-hilbert.parquet
  MOLDOVA_SHA256: 06bddb7a42283812c1032d85a6b138daf198b1b46592ba96ad84cbe09a12e5f5
  DUCKDB: duckdb==1.5.4
  DATA: ${{ github.workspace }}/bench-data

jobs:
  valve-guard:
    name: Valve guard
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The last step opens or updates the failure issue.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler time

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-valve-guard-${{ hashFiles('Cargo.lock') }}

      - name: Restore the #792 input
        id: cache-792
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, restore sub-path
        with:
          path: ${{ env.DATA }}/792
          key: valve-guard-792-${{ env.SRC_792_SHA256 }}-${{ hashFiles('benchmarks/prepare_792.py') }}-${{ env.DUCKDB }}

      - name: Rebuild the #792 input from the public download
        id: prepare-792
        if: steps.cache-792.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        run: |
          failure="$SRC_792_URL: download failed (expected SHA-256 $SRC_792_SHA256)"
          trap 'echo "::error title=Valve guard input unavailable::$failure"; echo "error=$failure" >> "$GITHUB_OUTPUT"' ERR
          mkdir -p "$DATA/792/dl"
          curl --fail --location --retry 3 -o "$DATA/792/dl/src.zip" "$SRC_792_URL"
          got=$(sha256sum "$DATA/792/dl/src.zip")
          got=${got%% *}
          failure="$SRC_792_URL: SHA-256 mismatch (expected $SRC_792_SHA256, got $got)"
          test "$got" = "$SRC_792_SHA256"
          failure="$SRC_792_URL: unpack/prepare failed (verified SHA-256 $got); see the prepare step log"
          unzip -q -o "$DATA/792/dl/src.zip" -d "$DATA/792/shp"
          uv run --with "$DUCKDB" python -I benchmarks/prepare_792.py \
            "$DATA/792/shp/hausumringe.shp" "$DATA/792/buildings.parquet"
          rm -rf "$DATA/792/dl" "$DATA/792/shp"

      - name: Save the #792 input
        if: steps.cache-792.outputs.cache-hit != 'true' && steps.prepare-792.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, save sub-path
        with:
          path: ${{ env.DATA }}/792
          key: ${{ steps.cache-792.outputs.cache-primary-key }}

      - name: Restore the Moldova input
        id: cache-moldova
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, restore sub-path
        with:
          path: ${{ env.DATA }}/coalesce/inputs
          key: valve-guard-moldova-${{ env.MOLDOVA_SHA256 }}

      - name: Fetch Moldova
        id: prepare-moldova
        if: steps.cache-moldova.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        run: |
          failure="$MOLDOVA_URL: download failed (expected SHA-256 $MOLDOVA_SHA256)"
          trap 'echo "::error title=Valve guard input unavailable::$failure"; echo "error=$failure" >> "$GITHUB_OUTPUT"' ERR
          mkdir -p "$DATA/coalesce/inputs"
          curl --fail --location --retry 3 -o "$DATA/coalesce/inputs/moldova-hilbert.parquet" "$MOLDOVA_URL"
          got=$(sha256sum "$DATA/coalesce/inputs/moldova-hilbert.parquet")
          got=${got%% *}
          failure="$MOLDOVA_URL: SHA-256 mismatch (expected $MOLDOVA_SHA256, got $got)"
          test "$got" = "$MOLDOVA_SHA256"

      - name: Save the Moldova input
        if: steps.cache-moldova.outputs.cache-hit != 'true' && steps.prepare-moldova.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, save sub-path
        with:
          path: ${{ env.DATA }}/coalesce/inputs
          key: ${{ steps.cache-moldova.outputs.cache-primary-key }}

      - name: Check input readiness
        id: inputs
        env:
          INPUT_792_OK: ${{ steps.cache-792.outputs.cache-hit == 'true' || steps.prepare-792.outcome == 'success' }}
          INPUT_MOLDOVA_OK: ${{ steps.cache-moldova.outputs.cache-hit == 'true' || steps.prepare-moldova.outcome == 'success' }}
          INPUT_792_ERROR: ${{ steps.prepare-792.outputs.error }}
          INPUT_MOLDOVA_ERROR: ${{ steps.prepare-moldova.outputs.error }}
        run: |
          if [ "$INPUT_792_OK" = true ] && [ "$INPUT_MOLDOVA_OK" = true ]; then
            echo "input_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "input_ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "input_error<<INPUT_ERRORS"
              echo "$INPUT_792_ERROR"
              echo "$INPUT_MOLDOVA_ERROR"
              echo "INPUT_ERRORS"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Build the CLI on mimalloc and on glibc
        if: steps.inputs.outputs.input_ok == 'true'
        run: |
          cargo build --release --locked -p tylertoo
          cp target/release/tylertoo "$RUNNER_TEMP/tylertoo-mim"
          cargo build --release --locked -p tylertoo --no-default-features --target-dir target/glibc
          cp target/glibc/release/tylertoo "$RUNNER_TEMP/tylertoo-glibc"

      - name: Check the valve
        id: guard
        if: steps.inputs.outputs.input_ok == 'true'
        shell: bash
        run: |
          uv run --no-project --python 3.12 python -I benchmarks/valve_guard.py check \
            --mim "$RUNNER_TEMP/tylertoo-mim" --glibc "$RUNNER_TEMP/tylertoo-glibc" \
            --data "$DATA" --json-out "$RUNNER_TEMP/valve-guard.json" \
            | tee "$RUNNER_TEMP/valve-guard.txt"

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valve-guard
          path: |
            ${{ runner.temp }}/valve-guard.json
            ${{ runner.temp }}/valve-guard.txt
          if-no-files-found: warn

      - name: Open or update the issue
        if: always() && (steps.inputs.outputs.input_ok == 'false' || steps.guard.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INPUT_OK: ${{ steps.inputs.outputs.input_ok }}
          INPUT_ERROR: ${{ steps.inputs.outputs.input_error }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
        run: |
          gh label create benchmark \
            --description "Benchmark lane" \
            --color 0E8A16 2>/dev/null || true

          create_or_update() {
            local title="$1" body="$2" kind="$3" existing
            existing=$(gh issue list --label benchmark --state open \
              --json number,title \
              --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body "$body" --add-label "P2,$kind"
              gh issue comment "$existing" --body "Still failing as of $RUN_URL"
            else
              gh issue create --title "$title" --label "benchmark,P2,$kind" --body "$body"
            fi
          }

          if [ "$INPUT_OK" = false ]; then
            BODY="Impact: P2. The nightly valve guard cannot check performance when
          a benchmark input cannot be downloaded, verified, or prepared.
          Workaround: repoint the input URL and SHA-256 in this workflow.

          This is not a valve regression. Input preparation failed:
          $INPUT_ERROR

          Run: $RUN_URL

          For #792, repoint SRC_792_URL to an accessible copy of the source zip
          and set SRC_792_SHA256 to that copy's verified SHA-256. For Moldova,
          update MOLDOVA_URL and MOLDOVA_SHA256. Commit the workflow change
          and rerun Bench nightly; changing the SHA-256 selects a new cache key.

          _Managed by .github/workflows/bench-nightly.yml. Close after inputs recover._"
            create_or_update "Valve guard input is unavailable" "$BODY" bug
          fi

          if [ "$GUARD_OUTCOME" = failure ]; then
            BODY="Impact: P2. The nightly performance check failed; users exporting
          the benchmark workloads may see higher wall time or peak RSS.
          Workaround: inspect the measurements and reproduce as shown below.

          The scheduled valve guard (benchmarks/valve_guard.py) failed.
          Inspect its output for the failing check or command:
          a guarded wall or peak RSS limit was exceeded, a cell regressed
          against its baseline, or the guard could not complete its measurements.

          Run: $RUN_URL

          The \`valve-guard\` artifact has the measurements and the guard's
          output. To reproduce on a quiet machine:

          \`\`\`
          cargo build --release -p tylertoo
          cargo build --release -p tylertoo --no-default-features --target-dir target/glibc
          uv run --no-project --python 3.12 python -I benchmarks/valve_guard.py check \\
            --mim target/release/tylertoo --glibc target/glibc/release/tylertoo
          \`\`\`

          ---
          _Managed by .github/workflows/bench-nightly.yml. Updated, not
          duplicated, on every failing night. Close it after a green night._"
            create_or_update "Nightly valve guard is failing" "$BODY" optimization
          fi

  suite:
    name: Nightly suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve base tag
        id: base
        run: |
          BASE=$(git describe --tags --abbrev=0 --match 'v*')
          echo "tag=$BASE" >> "$GITHUB_OUTPUT"
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "$BASE^{commit}")" ]; then
            echo "::notice::HEAD is the latest release tag; skipping the nightly suite"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.base.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install protoc and GNU time
        if: steps.base.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler time

      - name: Install uv
        if: steps.base.outputs.skip != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Cache cargo registry
        if: steps.base.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('Cargo.lock') }}

      - name: Restore base binary
        id: cache-base
        if: steps.base.outputs.skip != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ../base-target/release/tylertoo
          key: nightly-base-${{ steps.base.outputs.tag }}-${{ runner.arch }}

      - name: Build base binary
        if: steps.base.outputs.skip != 'true' && steps.cache-base.outputs.cache-hit != 'true'
        env:
          BASE: ${{ steps.base.outputs.tag }}
        run: |
          git worktree add ../base "$BASE"
          cd ../base
          cargo build --release --locked -p tylertoo --target-dir ../base-target

      - name: Save base binary
        if: steps.base.outputs.skip != 'true' && steps.cache-base.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ../base-target/release/tylertoo
          key: ${{ steps.cache-base.outputs.cache-primary-key }}

      - name: Build head binary
        if: steps.base.outputs.skip != 'true'
        run: cargo build --release --locked -p tylertoo

      # bench-inputs-v2 URLs will fail until the maintainer creates the release.
      - name: Select nightly inputs and hash their checksums
        id: nightly-inputs
        if: steps.base.outputs.skip != 'true'
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "benchmarks")
          import run_manifest as rm

          manifest = rm.load_manifest(rm.MANIFEST)
          names = sorted({name for cell in manifest["sets"]["nightly"]
                          for name in rm.cell_input_names(manifest["cells"][cell])})
          inputs = {name: manifest["inputs"][name] for name in names}
          checksums = "\n".join(inp["sha256"] for inp in inputs.values())
          digest = hashlib.sha256(checksums.encode()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"sha256={digest}", file=out)
          # fetch has no set selector, so give it only the selected inputs.
          lines = []
          for name, inp in inputs.items():
              lines.append(f"[inputs.{name}]")
              for key in ("file", "url", "sha256"):
                  lines.append(f"{key} = {json.dumps(inp[key])}")
          Path(os.environ["RUNNER_TEMP"], "nightly-inputs.toml").write_text("\n".join(lines) + "\n")
          PY

      - name: Cache nightly inputs
        if: steps.base.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DATA }}/inputs
          key: nightly-inputs-${{ steps.nightly-inputs.outputs.sha256 }}

      - name: Fetch nightly inputs
        if: steps.base.outputs.skip != 'true'
        run: |
          uv run --no-project --python 3.12 python -I benchmarks/run_manifest.py \
            --manifest "$RUNNER_TEMP/nightly-inputs.toml" fetch --data "$DATA"

      - name: Run nightly suite
        if: steps.base.outputs.skip != 'true'
        run: |
          uv run --no-project --python 3.12 python -I benchmarks/run_manifest.py run \
            --data "$DATA" --set nightly --name nightly --pairs 3 \
            --bin base=../base-target/release/tylertoo --bin head=target/release/tylertoo

      - name: Gate nightly suite
        id: gate
        if: steps.base.outputs.skip != 'true'
        shell: bash
        run: |
          uv run --no-project --python 3.12 python -I benchmarks/run_manifest.py gate \
            --data "$DATA" --name nightly --wall-max 1.25 --rss-max 1.15 \
            --baseline benchmarks/baseline/nightly.json | tee "$RUNNER_TEMP/nightly-gate.md"

      - name: Job summary
        if: always() && steps.gate.outcome != 'skipped'
        run: |
          if [ -f "$RUNNER_TEMP/nightly-gate.md" ]; then
            cat "$RUNNER_TEMP/nightly-gate.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update the regression issue
        if: failure() && steps.gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create benchmark \
            --description "Benchmark lane" \
            --color 0E8A16 2>/dev/null || true

          TITLE="Nightly benchmark regression"
          TABLE=$(cat "$RUNNER_TEMP/nightly-gate.md")
          BODY="Impact: P2. The nightly suite failed its performance gate;
          users exporting the benchmark workloads may see higher wall time
          or peak RSS. Workaround: compare the base and head measurements
          below and inspect the run logs before selecting a release.

          $TABLE

          Run: $RUN_URL

          _Managed by .github/workflows/bench-nightly.yml. Updated on every
          failing night. Close after a green night._"
          EXISTING=$(gh issue list --label benchmark --state open \
            --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY" --add-label "P2,optimization"
            gh issue comment "$EXISTING" --body "Still failing as of $RUN_URL"
          else
            gh issue create --title "$TITLE" --label "benchmark,P2,optimization" --body "$BODY"
          fi

      - name: Record baseline
        if: always() && inputs.record_baseline && (steps.gate.outcome == 'success' || steps.gate.outcome == 'failure')
        run: |
          uv run --no-project --python 3.12 python -I benchmarks/run_manifest.py gate \
            --data "$DATA" --name nightly --wall-max 1.25 --rss-max 1.15 \
            --baseline benchmarks/baseline/nightly.json \
            --record-baseline "$RUNNER_TEMP/nightly.json"

      - name: Upload baseline for review
        if: always() && inputs.record_baseline && (steps.gate.outcome == 'success' || steps.gate.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-baseline
          path: ${{ runner.temp }}/nightly.json
          if-no-files-found: error
