# Benchmarks + convert-regression guard.
#
# Two jobs:
#   bench         — criterion micro-benches (clipping, bbox_containment),
#                   tracked over time via uploaded reports. NOT a PR gate
#                   (push/dispatch only) so no permanently-skipped job
#                   clutters PR check lists.
#   convert-guard — the PR gate against a change altering output. TWO checks,
#                   because one of them was not enough:
#                     1. ci_guard.py — structural signature of `overview`
#                        (per-level feature/vertex counts, total rows) on the
#                        fixtures-v1 inputs.
#                     2. convert_guard_golden — per-tile digests of a full
#                        convert -> export build (#558). The structural check
#                        stops at pass 1 and compares counts, so it green-lit
#                        the i_overlay 8->9 bump that moved 18 of 588 tiles on
#                        real data. This one compares the tiles themselves.
#                   Timing/RSS are intentionally not gated — far too
#                   noisy on shared runners; see benchmarks/overview/PROFILE.md
#                   for the tracked timing numbers and ci_guard.py for the
#                   gated structural signature.
#
# The old tiling/streaming pipeline benches were deleted with the legacy
# pipeline (#177/#189); this runs the surviving bench targets in
# crates/core/benches/.

name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata
          key: fixtures-v1-${{ runner.os }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks
        run: |
          cargo bench --all-features --bench clipping
          cargo bench --all-features --bench bbox_containment
        timeout-minutes: 20

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: criterion-reports
          path: target/criterion/

  convert-guard:
    name: Convert regression guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata
          key: fixtures-v1-${{ runner.os }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-guard-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --package tylertoo

      - name: Convert regression guard (structural, deterministic)
        run: python3 benchmarks/overview/ci_guard.py --check

      # #558: the golden tile guard. Its fixture is a plain committed blob, so
      # this step depends on nothing the steps above fetch — it runs even if
      # the fixtures-v1 download or its cache is broken. Release profile: the
      # binary build above already warmed it, and the run is ~0.5 s there
      # against ~20 s in debug. Verified to produce identical digests under
      # both profiles.
      - name: Convert regression guard (golden tiles, #558)
        run: >-
          cargo test --locked --release -p tylertoo-core
          --test convert_guard_golden
