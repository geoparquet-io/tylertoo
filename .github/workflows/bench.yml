# Benchmarks.
#
# One job:
#   bench         — criterion micro-benches over the hot paths (pass-1
#                   decode, assign, simplify cascade, mvt encode + value
#                   dedup, clip, bbox containment, tile gzip+dedup; the list
#                   lives in scripts/criterion_compare.sh), tracked over time
#                   via uploaded reports. NOT a PR gate (push/dispatch only)
#                   so no permanently-skipped job clutters PR check lists.
#                   The numeric regression gate (#448) is a separate,
#                   opt-in workflow: bench-regression.yml.
#
# The convert regression guard (benchmarks/overview/ci_guard.py) used to be
# a second job here; it now runs through export and lives in e2e.yml
# together with the independent-reader archive checks (#421, #425), since
# both need the same release binary over the fixtures-v1 inputs. Timing/RSS
# are intentionally not gated anywhere — far too noisy on shared runners;
# see benchmarks/overview/PROFILE.md for the tracked timing numbers.
#
# The old tiling/streaming pipeline benches were deleted with the legacy
# pipeline (#177/#189); this runs the surviving bench targets in
# crates/core/benches/.

name: Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata
          key: fixtures-v1-${{ runner.os }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks
        run: |
          for bench in $(scripts/criterion_compare.sh --list); do
            cargo bench --all-features --bench "$bench"
          done
        timeout-minutes: 30

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: criterion-reports
          path: target/criterion/

