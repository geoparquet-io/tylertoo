# CodSpeed (#614) — per-PR benchmark signal from instruction counts.
#
# Builds the criterion benches with cargo-codspeed and runs them under
# CodSpeed's simulation mode, which counts instructions (cache-weighted)
# instead of timing wall-clock. The count does not depend on the runner's
# load, so unlike bench-regression.yml this needs no opt-in label, and
# CodSpeed comments per-bench deltas against the base branch.
#
# Bench set (#810): the `cpu` benches of crates/core/benches/benches.toml,
# minus the [codspeed] exemptions in ci/exemptions.toml, printed by
# scripts/bench_list.py. Syscall-dominated benches (pipeline, coverage_fill,
# assign: file I/O and thread wake-ups, which simulation leaves out of its
# count) run only in bench-regression.yml's wall-clock gate.
#
# What runs when (simulation is slow: every bench runs under Valgrind):
#   pull_request  only PRs touching crates/core or the build (`paths`), and
#                 only the benches whose code the PR touches: each bench's
#                 `paths` in benches.toml (`bench_list.py codspeed`). CodSpeed
#                 reports the others as "skipped" with their baseline numbers.
#                 A PR touching no benched code skips every step and passes.
#   push (main)   every CodSpeed bench on every push, unfiltered: these runs
#                 are the baselines, so a PR always has a run at its base
#                 commit (no "no successful run was found on main" fallback
#                 to an older commit, #810).
#
# The benches build against `codspeed-criterion-compat` (renamed to
# `criterion` in crates/core/Cargo.toml), so their code is unchanged and plain
# `cargo bench` still runs ordinary criterion locally and in
# bench-regression.yml.
#
# bench-regression.yml is the wall-clock cross-check, behind the `benchmark`
# label and weekly on main: instruction counts miss effects such as
# memory-bandwidth or thread-scaling changes that only show up in time.
#
# Auth: OIDC (`id-token: write`), no token secret; this needs the CodSpeed
# GitHub app installed on the repo. See DEVELOPMENT.md, "CodSpeed".

name: CodSpeed

on:
  pull_request:
    # Keep in step with global_paths in crates/core/benches/benches.toml.
    # No Cargo.lock: a lockfile-only PR (Renovate, an advisory bump) is
    # measured by the run on main after it merges (#759).
    paths:
      - "crates/core/**"
      - "Cargo.toml"
      - "ci/exemptions.toml"
      - ".github/workflows/codspeed.yml"
      - "scripts/bench_list.py"
  # Every push to main, unfiltered (#810): each one is the base some PR
  # compares against.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# PRs cancel superseded runs. Main never does: each main run is the baseline
# for the PRs after it, and cancelling one left merges unmeasured.
# Per commit off PRs (#779): one group per ref let the next push to main
# cancel this one's queued run, leaving that commit with no CodSpeed
# baseline for PRs to compare against.
concurrency:
  group: codspeed-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  codspeed:
    name: CodSpeed benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TYLERTOO_BENCH_REQUIRE_FIXTURES: "1"
    steps:
      # Depth 2: on a PR, HEAD is GitHub's merge commit and HEAD^1 the base
      # branch tip, so `git diff HEAD^1 HEAD` is exactly the PR's change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Select benches
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Changed files:"
            git diff --name-only HEAD^1 HEAD | sed 's/^/  /'
            benches=$(git diff --name-only HEAD^1 HEAD | scripts/bench_list.py codspeed)
          else
            benches=$(scripts/bench_list.py codspeed --all)
          fi
          echo "Selected benches: ${benches:-none (no benched code changed)}"
          echo "benches=$benches" >> "$GITHUB_OUTPUT"

      - name: Cache test fixtures
        if: steps.select.outputs.benches != ''
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata/*.parquet
          key: fixtures-v1-${{ runner.os }}-${{ hashFiles('tests/fixtures/realdata/*.parquet') }}

      - name: Download test fixtures
        if: steps.select.outputs.benches != '' && steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # Cached or downloaded, the fixtures must match benchmarks/fixtures.sha256.
      - name: Verify test fixtures
        if: steps.select.outputs.benches != ''
        run: scripts/ci/verify_fixtures.sh tests/fixtures/realdata

      - name: Install Rust
        if: steps.select.outputs.benches != ''
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install protoc
        if: steps.select.outputs.benches != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # Own key: cargo-codspeed builds into target/codspeed with its own
      # instrumentation cfg, so sharing another bench job's entry would only
      # thrash it. .crates.toml/.crates2.json are cargo's record of the
      # installed cargo-codspeed; without them the next step can't tell the
      # cached binary is the pinned version.
      - name: Cache cargo
        if: steps.select.outputs.benches != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-codspeed
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            target
          key: ${{ runner.os }}-cargo-codspeed-${{ hashFiles('**/Cargo.lock') }}

      # Keep in step with codspeed-criterion-compat in crates/core/Cargo.toml.
      - name: Install cargo-codspeed
        if: steps.select.outputs.benches != ''
        run: |
          installed=$(cargo codspeed --version 2>&1 || true)
          echo "Found: ${installed:-nothing}"
          if [ "$installed" != "cargo-codspeed 5.0.3" ]; then
            cargo install cargo-codspeed --version 5.0.3 --locked --force
          fi

      # Each bench binary is a fat-LTO link (lto = true, codegen-units = 1)
      # peaking near 8 GB, and cargo's default parallelism links several at
      # once: on the 16 GB runner that ends in exit 143. So compile the
      # dependencies in parallel through the first bench, then link the rest
      # with -j 1. (One build call per bench does not work: each call
      # replaces the binaries the previous one collected.)
      - name: Build benches
        if: steps.select.outputs.benches != ''
        env:
          BENCHES: ${{ steps.select.outputs.benches }}
        run: |
          read -ra benches <<<"$BENCHES"
          bench_args=()
          for b in "${benches[@]}"; do
            bench_args+=(--bench "$b")
          done
          build=(cargo codspeed build -m simulation -p tylertoo-core --all-features --locked)
          "${build[@]}" --bench "${benches[0]}"
          if [ "${#benches[@]}" -gt 1 ]; then
            "${build[@]}" -j 1 "${bench_args[@]}"
          fi

      # Runs whatever the build step collected, i.e. the selected benches.
      - name: Run benches
        if: steps.select.outputs.benches != ''
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: cargo codspeed run -m simulation -p tylertoo-core
