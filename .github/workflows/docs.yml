# Deploy Documentation: the Zensical site to GitHub Pages.
#
# Purpose: build the site on pushes to main and deploy it to Pages. Pull
# requests are covered by the `docs` job in ci.yml, which runs the same
# strict build plus every documented example.
#
# KNOWN FLAKE: the Pages deploy step occasionally fails with a transient
# "try again later" from GitHub. Policy: manual rerun (Actions -> re-run
# failed jobs). Not worth a retry loop — the failure is rare and a rerun
# always succeeds.

name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: crates/python/uv.lock

      # Only the docs dependency group: the site needs zensical, not the
      # compiled extension.
      - name: Build documentation
        run: |
          uv run --project crates/python --locked --only-group docs \
            zensical build --strict --clean
        env:
          UV_PYTHON: "3.12"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
