# Archive e2e: the convert+export regression guard and independent-reader
# validation of the archives it produces (#421, #425).
#
# One job, because every step needs the same thing — a release binary run
# over the fixtures-v1 inputs — and a second job would rebuild it:
#
#   1. benchmarks/overview/ci_guard.py --check --keep-archives
#      `overview` -> `export-pmtiles` -> `stats` / `decode` per fixture; the
#      structural signature (per-level feature/vertex counts, per-zoom tile
#      counts, written and decoded feature totals, archive bytes +-2%) is
#      compared exactly against the committed ci_baseline.json. This is the
#      guard that used to live in bench.yml and stopped at pass 1 (#425).
#   2. go-pmtiles `pmtiles verify` on every archive from step 1: the
#      reference PMTiles v3 structural validator, a static binary at a
#      pinned release with the download's sha256 checked
#      (scripts/setup_go_pmtiles.sh).
#   3. scripts/verify_archive.py on every archive: the Python `pmtiles`
#      reader walks header/metadata/directories, and `mapbox-vector-tile`
#      decodes sampled tiles at every zoom (layer name, geometry validity,
#      non-zero features). Neither reader shares a line of code with our
#      writer — the point of #421.
#   4. The strict whole-archive invariants (#779, G3):
#      benchmarks/e2e/run_e2e.py --invariants runs `tiles` over a settings
#      matrix (defaults, --verbatim, --polygon-visibility 0,
#      --simplify-factor 0, --coverage-fill) and decodes EVERY tile with
#      scripts/verify_archive.py --strict: tile size <= the caps, OGC-valid
#      polygons, feature and property accounting, feature counts that never
#      rise toward coarse zooms, placeholder squares that decay. Steps 1-3
#      compare output to earlier output; this one checks properties that
#      must hold whatever the baseline says. Known failures are rows of
#      benchmarks/e2e/invariant_exemptions.toml, each tied to an open issue.
#      PRs run defaults plus each fixture's most bug-prone setting; pushes
#      to main, the nightly schedule and dispatches run the full matrix.
#
# Our own tests only ever read our archives with our own code; the writer
# is self-implemented (the pmtiles crate is read-only). A self-consistent-
# but-wrong header/directory/framing passes the Rust suite and fails here.
#
# Only OUR archives go through `pmtiles verify`: the tippecanoe-made
# tests/fixtures/golden/*.pmtiles are inputs to golden comparisons, not
# outputs, and are not this job's concern.
#
# Intended as a PR-gating check. Required checks are branch-protection
# contexts, so "Archive e2e (independent readers)" has to be added there
# (repo settings) — this file cannot do that.

name: Archive e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Nightly: the full invariant matrix (step 4) on main.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

# PRs group per ref and cancel superseded runs; every other event (a push to
# main, a schedule, a dispatch) groups per SHA, so a main run is never
# cancelled by the next merge (#779, the same block as ci.yml).
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  GO_PMTILES_VERSION: "1.31.2"

jobs:
  # Docs-only and Python-only PRs skip this workflow's job: nothing it
  # builds or reads can change (scripts/ci/python_only.sh holds the rule,
  # docs included; ci.yml's plan job uses the same one). A job skipped by
  # `if:` reports "skipped" under its own name, which satisfies the
  # required check.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD^1 (the base tip) for the docs-only diff below.
          fetch-depth: 2

      - name: Rust code, or only docs and Python?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] \
            && git diff --name-only HEAD^1 HEAD | scripts/ci/python_only.sh; then
            code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  archive-e2e:
    name: Archive e2e (independent readers)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata/*.parquet
          key: fixtures-v1-${{ runner.os }}-${{ hashFiles('tests/fixtures/realdata/*.parquet') }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-guard-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --package tylertoo

      # Step 1: the structural guard, keeping the archives for steps 2-3.
      - name: Convert + export regression guard (structural, deterministic)
        run: |
          python3 benchmarks/overview/ci_guard.py --check \
            --keep-archives e2e-archives

      # Step 2: go-pmtiles verify. The binary is cached per version and
      # platform; the setup script re-checks the version string on a cache
      # hit and the tarball's sha256 on a download.
      - name: Cache go-pmtiles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/go-pmtiles-${{ env.GO_PMTILES_VERSION }}
          key: go-pmtiles-${{ env.GO_PMTILES_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install go-pmtiles (pinned, checksummed)
        run: scripts/setup_go_pmtiles.sh

      - name: pmtiles verify (go-pmtiles) on every produced archive
        run: |
          eval "$(scripts/setup_go_pmtiles.sh --print-path)"
          status=0
          for f in e2e-archives/*.pmtiles; do
            echo "::group::pmtiles verify $f"
            if "$PMTILES_BIN" verify "$f"; then
              echo "OK   $f"
            else
              echo "FAIL $f"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      # Step 3: the Python readers. uv resolves the script's PEP 723 inline
      # dependencies (pinned pmtiles + mapbox-vector-tile).
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: scripts/verify_archive.py

      - name: Decode sampled tiles with pmtiles + mapbox-vector-tile
        run: |
          status=0
          for f in e2e-archives/*.pmtiles; do
            layer="$(basename "$f" .pmtiles)"
            uv run scripts/verify_archive.py "$f" --layer "$layer" \
              --per-zoom 5 || status=1
          done
          exit "$status"

      # Step 4: the strict whole-archive invariants (#779). The exemption
      # file first: well-formed, its row count equal to the pin in
      # verify_archive.py, every row's issue still open.
      - name: Check the invariant exemptions (pinned count, open issues)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run scripts/verify_archive.py \
            --check-exemptions benchmarks/e2e/invariant_exemptions.toml \
            --check-issues-open

      - name: Strict invariants over every tile (settings matrix)
        env:
          TIER: ${{ github.event_name == 'pull_request' && 'pr' || 'full' }}
        run: |
          eval "$(scripts/setup_go_pmtiles.sh --print-path)"
          export PMTILES_BIN
          status=0
          python3 benchmarks/e2e/run_e2e.py --invariants --tier "$TIER" \
            --work e2e-invariants --markdown invariants.md || status=$?
          cat invariants.md >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"

      # Failure-only: the admin fixture's z0-14 archive is ~100 MB.
      - name: Upload produced archives
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-archives
          path: e2e-archives/
          retention-days: 7
          if-no-files-found: ignore
