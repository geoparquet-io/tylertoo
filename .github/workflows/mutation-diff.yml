# Direct cargo-mutants exit status gates every code PR through CI passed.
name: Mutation Diff

on:
  workflow_call:

permissions:
  contents: read

jobs:
  mutants:
    name: Mutants (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: tylertoo-core
            config: .cargo/mutants.toml
          - package: tylertoo
            config: .cargo/mutants-cli.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download test fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install mutation tools
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Test mutants in the PR diff
        env:
          PACKAGE: ${{ matrix.package }}
          CONFIG: ${{ matrix.config }}
        run: |
          git diff --no-ext-diff --no-renames HEAD^1 HEAD -- crates/ > mutation.diff
          cargo mutants --cargo-arg=--locked --package "$PACKAGE" --config "$CONFIG" --in-diff mutation.diff
      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-diff-${{ matrix.package }}
          path: mutants.out/
          if-no-files-found: ignore
