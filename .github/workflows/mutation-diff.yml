# Direct cargo-mutants exit status gates every code PR through CI passed.
name: Mutation Diff

on:
  workflow_call:

permissions:
  contents: read

env:
  MUTATION_TOOL: cargo-mutants@27.1.0
  # Runner budget: see the plan step.
  MAX_SHARDS: 4

jobs:
  plan:
    name: Plan mutation shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      shard_total: ${{ steps.plan.outputs.shard_total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install mutation tools
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: ${{ env.MUTATION_TOOL }}
      - name: Size shards from the PR diff
        id: plan
        shell: bash
        run: |
          # Reuse the gate's diff, workspace and config; listing never compiles.
          # A single shard lists the whole set; --sharding requires --shard.
          # No changed Rust files produces no JSON; slurp treats that as [].
          count=$(scripts/mutants-diff.sh HEAD^1 --cap-lints true --sharding round-robin --shard 0/1 -j 2 --list --json | jq -s 'add // [] | length')
          # The diff is cut into ceil(count / 40) round-robin slices, and at
          # most MAX_SHARDS of them run: the org runs 20 jobs at once across
          # every PR and a core PR's CI already holds ~13. Up to 160 mutants
          # that is the whole diff; past it, slices 0..3 are a fixed sample
          # spread across the whole diff (round-robin), the same on every run.
          # The weekly mutation-tests.yml sweep covers the rest.
          total=$(jq -n --argjson n "$count" 'if $n == 0 then 0 else ($n / 40 | ceil) end')
          shards=$(jq -cn --argjson t "$total" --argjson m "$MAX_SHARDS" '[range(0; ([$t, $m] | min))]')
          run=$(jq -n --argjson n "$count" --argjson t "$total" --argjson m "$MAX_SHARDS" 'if $t <= $m then $n else ([range(0; $m)] | map(($n - . + $t - 1) / $t | floor) | add) end')
          echo "$count mutants in this diff; running slices $shards of $total ($run mutants)"
          {
            echo "### Mutation plan"
            echo "$count mutants in this diff. Running slices \`$shards\` of $total: $run mutants."
            if [ "$total" -gt "$MAX_SHARDS" ]; then
              echo "Diff exceeds $((MAX_SHARDS * 40)) mutants: this is a fixed round-robin sample."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "shard_total=$total" >> "$GITHUB_OUTPUT"

  mutants:
    name: Mutants (workspace diff, shard ${{ matrix.shard }})
    needs: plan
    # Job conditions run before matrix expansion: [] launches no runners.
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Run every slice; one survivor must not cancel the others' evidence.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
      # The slice count comes from the plan, not the matrix: a sampled
      # diff runs fewer jobs than it has slices.
      SHARD_COUNT: ${{ needs.plan.outputs.shard_total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 2
      - name: Download test fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install mutation tools
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          # All shards must enumerate with the same mutator version.
          tool: ${{ env.MUTATION_TOOL }},cargo-nextest
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libsqlite3-dev zlib1g-dev
      - name: Cache tippecanoe
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/tippecanoe-*
            .tools/src-*
          key: tippecanoe-${{ hashFiles('benchmarks/e2e/setup_tippecanoe.sh') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Build tippecanoe (pinned tag + SHA) and put it on PATH
        run: |
          benchmarks/e2e/setup_tippecanoe.sh
          eval "$(benchmarks/e2e/setup_tippecanoe.sh --print-path)"
          dirname "$TIPPECANOE_BIN" >> "$GITHUB_PATH"
      - name: Install go-pmtiles (pinned, checksummed)
        run: |
          scripts/setup_go_pmtiles.sh
          eval "$(scripts/setup_go_pmtiles.sh --print-path)"
          echo "PMTILES_BIN=$PMTILES_BIN" >> "$GITHUB_ENV"
      - name: Test mutants in the PR diff
        run: scripts/mutants-diff.sh HEAD^1 --cap-lints true --sharding round-robin --shard "$SHARD/$SHARD_COUNT" -j 2
      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-diff-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: ignore

  gate:
    name: Mutation gate
    needs: [plan, mutants]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful planning and mutation tests
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MUTANTS_RESULT: ${{ needs.mutants.result }}
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          if [[ "$PLAN_RESULT" != success ]]; then
            echo "::error::Mutation planning $PLAN_RESULT"
            exit 1
          fi
          if [[ "$SHARDS" == '[]' && "$MUTANTS_RESULT" == skipped ]]; then
            echo "No mutants in this diff"
          elif [[ "$MUTANTS_RESULT" == success ]]; then
            echo "All mutation shards passed"
          else
            echo "::error::Mutation shards $MUTANTS_RESULT"
            exit 1
          fi
