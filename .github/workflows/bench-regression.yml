# Criterion regression gate (#448) — same-runner base-vs-head.
#
# One job on one runner: build and run the criterion benches at the base
# revision (`--save-baseline base`), then at the head revision
# (`--baseline-lenient base`), then gate with scripts/criterion_gate.py.
# Comparing two runs from the same machine minutes apart is the only timing
# comparison shared runners support honestly; a baseline carried over from an
# earlier run on a different VM is mostly measuring the VM (#393).
#
# Base revision:
#   pull_request        merge-base of the PR head and its base branch.
#   workflow_dispatch   the `base` input if given; otherwise, on main, the
#                       latest v* release tag before HEAD ("what changed since
#                       the last release"); on any other branch, its merge-base
#                       with origin/main.
#
# Triggers (#678):
#   pull_request        every PR that changes what the benches measure: the
#                       paths in BENCHED below (crates/core, the build, this
#                       gate's own workflow and scripts). The `changes` job
#                       decides; a PR touching none of them skips the gate.
#                       The `benchmark` label still starts it on any PR
#                       (applying the label starts it; later pushes re-run it
#                       while the label stays).
#   workflow_dispatch   manual, with the optional `base` input.
# The paths are checked in a job rather than with an `on.pull_request.paths`
# filter: that filter applies to `labeled` events too, so the label could
# never start the gate on a PR outside the paths. There is no schedule:
# main-vs-main on a timer compares a revision against itself and only
# measures noise. Kept in its own workflow so label events don't re-run
# bench.yml's convert-guard.
#
# Cost: one run is 41-48 min of ubuntu-latest (#432, and the #678 A/A runs;
# almost all of it the two bench passes), on PRs that touch BENCHED only.
#
# Gate: see the "Check for regressions" step for the thresholds and the
# noise data behind them, and DEVELOPMENT.md, "Criterion regression gate".

name: Bench regression

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      base:
        description: "Base revision to compare against (default: see workflow header)"
        required: false
        default: ""

permissions:
  contents: read

# One run per PR: a new push cancels the old run. A `labeled` event for some
# other label gets its own group, so adding an unrelated label to a PR can't
# cancel a gate run in flight (that event's run skips the gate anyway). Each
# dispatch is its own group: two dispatches may name different bases.
concurrency:
  group: >-
    bench-regression-${{ github.event.pull_request.number || github.run_id }}${{
    github.event.action == 'labeled' && github.event.label.name != 'benchmark'
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Benched paths changed?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      benched: ${{ steps.diff.outputs.benched }}
    steps:
      # Depth 2: on a PR, HEAD is GitHub's merge commit and HEAD^1 the base
      # branch tip, so `git diff HEAD^1 HEAD` is exactly the PR's change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Diff against the base branch
        id: diff
        run: |
          # BENCHED: what the benches measure, or how they are run and gated.
          # Wider than codspeed.yml's per-bench selection on purpose: any
          # crates/core change runs every bench, so a regression that reaches
          # a bench through some distant module is still caught on the PR.
          BENCHED='^(crates/core/.*|Cargo\.toml|Cargo\.lock|\.github/workflows/bench-regression\.yml|scripts/criterion_compare\.sh|scripts/criterion_gate\.py)$'
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          sed 's/^/  /' <<<"$changed"
          if grep -qE "$BENCHED" <<<"$changed"; then
            echo "benched=true" >> "$GITHUB_OUTPUT"
          else
            echo "No benched path changed; the gate skips unless the PR has the benchmark label."
            echo "benched=false" >> "$GITHUB_OUTPUT"
          fi

  criterion-regression:
    name: Criterion regression gate
    needs: changes
    runs-on: ubuntu-latest
    # Dispatch: always. PR: when it changes a benched path or carries the
    # `benchmark` label. A `labeled` event runs it only when that label is
    # `benchmark` (any other label changes nothing worth re-benching).
    # `!cancelled()` because a dispatch skips `changes`, and a skipped need
    # would otherwise skip this job too.
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.action == 'labeled' && github.event.label.name == 'benchmark') ||
       (github.event.action != 'labeled' &&
        (needs.changes.outputs.benched == 'true' ||
         contains(github.event.pull_request.labels.*.name, 'benchmark'))))
    timeout-minutes: 90
    env:
      TYLERTOO_BENCH_REQUIRE_FIXTURES: "1"
      CRITERION_HOME: ${{ github.workspace }}/target/criterion-compare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve base revision
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_BASE: ${{ inputs.base }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base=$(git merge-base "$PR_BASE_SHA" HEAD)
          elif [ -n "$INPUT_BASE" ]; then
            base=$(git rev-parse --verify "${INPUT_BASE}^{commit}")
          elif [ "$REF_NAME" = "main" ]; then
            tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD^)
            base=$(git rev-parse --verify "${tag}^{commit}")
          else
            base=$(git merge-base origin/main HEAD)
          fi
          if [ "$base" = "$(git rev-parse HEAD)" ]; then
            echo "::error::base revision $base is HEAD itself; nothing to compare"
            exit 1
          fi
          echo "Comparing base $base -> head $(git rev-parse HEAD)"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata
          key: fixtures-v1-${{ runner.os }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # Own key: this job builds two revisions into one target dir, so it must
      # not share (or overwrite) bench.yml's cache entry. Criterion output goes
      # to CRITERION_HOME, which criterion_compare.sh wipes before running, so
      # a restored target/ can't leak old results into the comparison.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-regression-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benches at base, then head
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          rm -rf target/criterion target/criterion-compare
          scripts/criterion_compare.sh "$BASE_SHA"
        timeout-minutes: 75

      # Thresholds, from measured noise (#678). Four A/A runs on this job
      # (38776884521, 38776888984, 38777309254, 38784871499: no benched code
      # changed between the two sides), 52 benches each, 208 comparisons:
      #   |change| median 1.0%, p90 4.9%, p95 6.5%, max 26.9%.
      #   CI lower bound: max +6.1% outside the Sutherland–Hodgman benches.
      #   Inside them: +26.2% (wide_polygon_clip/sutherland_hodgman/316000),
      #   +14.9% (sutherland_hodgman/316000), +14.2% (sutherland_hodgman/
      #   1000), +12.5% (wide_polygon_clip/sutherland_hodgman/10000), each
      #   with an interval under 3 points wide.
      # Criterion's interval only covers noise within one run, and those
      # benches move between runs of the same code. The old flat +25% failed
      # the fourth run on no change. Hence: fail at a +10% lower bound, and
      # +50% (about twice the worst A/A result) for the --noisy family, a
      # backstop for gross regressions only; CodSpeed's instruction counts
      # are the finer signal there.
      # Replayed on #432 (overflow checks in release, 36328559030), this
      # fails clip_geometry/100000 at +12.9%; the old +25% passed it.
      # Re-measure with A/A dispatches (a branch whose only change is outside
      # BENCHED) before tightening further.
      - name: Check for regressions
        run: >-
          python3 scripts/criterion_gate.py --check
          --criterion-dir "$CRITERION_HOME" --baseline base --warn 10 --fail 10
          --noisy 'sutherland_hodgman/*' --noisy 'wide_polygon_clip/sutherland_hodgman/*'
          --noisy-fail 50

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-regression-report
          path: target/criterion-compare/
