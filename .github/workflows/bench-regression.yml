# Criterion regression gate (#448) — same-runner base-vs-head.
#
# One job on one runner: build and run the criterion benches at the base
# revision (`--save-baseline base`), then at the head revision
# (`--baseline-lenient base`), then gate with scripts/criterion_gate.py.
# Comparing two runs from the same machine minutes apart is the only timing
# comparison shared runners support honestly; a baseline carried over from an
# earlier run on a different VM is mostly measuring the VM (#393).
#
# Two hosts (one matrix leg each, as in valve-guard.yml):
#   github  ubuntu-latest (4 cores): every gated bench.
#   pinned  the maintainer's 64-core VM, a self-hosted runner labelled
#           `tylertoo-bench`: the `pipeline` bench only, nightly. On 4 cores
#           pass 2's column-split decode never runs (read_decode_plan grants
#           cores / 4 / read workers threads), so the bench's list-heavy and
#           small-row-groups cells, which slowed under `--profile speed` when
#           the split did (#876), time only the one-thread path there. The
#           leg exists only while the repository variable
#           TYLERTOO_BENCH_RUNNER is "true". It never runs on pull_request
#           (the matrix and `runs-on` both refuse it), so the self-hosted
#           runner never runs code from a fork.
# Each leg compares base and head on its own machine; the two hosts' numbers
# are never compared with each other (separate artifacts, summaries and
# issues).
#
# Base revision:
#   pull_request        merge-base of the PR head and its base branch.
#   schedule (weekly)   the last main commit at least 7 days old: a
#                       week-over-week comparison, both sides on one VM. A
#                       week with no new commits skips the run.
#   schedule (nightly)  the last main commit at least 1 day old, on the
#                       pinned host. A day with no new commits skips.
#   workflow_dispatch   the `base` input if given; otherwise, on main, the
#                       latest v* release tag before HEAD ("what changed since
#                       the last release"); on any other branch, its merge-base
#                       with origin/main.
#
# Triggers (#759):
#   pull_request        only with the `benchmark` label. Applying the label
#                       starts it; later pushes re-run it while the label
#                       stays. It used to run on every crates/core PR (#678):
#                       ~45 min a push, one real catch in 62 runs and seven
#                       false reds, and never a required check. CodSpeed
#                       (codspeed.yml) is the per-PR signal; label a PR that
#                       changes threading, I/O or memory behaviour, which
#                       instruction counts can't see.
#   schedule            Mondays, on main, github leg. The table goes to the
#                       pinned "Weekly benchmark comparison" issue, one
#                       comment a week, so the history stays readable in one
#                       place. This replaced bench.yml's per-push criterion
#                       run, whose numbers compared different VMs and which
#                       nothing read.
#                       Nightly at 01:00 UTC, pinned leg: done long before
#                       valve-guard.yml's 05:30 run on the same host, so the
#                       two never share its cores. A failing night comments
#                       its table on the "Nightly pipeline benchmark (64-core
#                       host)" issue; a passing one only leaves its summary.
#   workflow_dispatch   manual, with the optional `base` input: both legs
#                       (the pinned one while TYLERTOO_BENCH_RUNNER is true).
# The label is checked in the job's `if:` rather than with `on.pull_request`
# filters, which can't select on labels.
#
# Cost: one run is 41-48 min of ubuntu-latest (#432, and the #678 A/A runs;
# almost all of it the two bench passes), before the sample cuts in #759.
#
# Gate: see the "Check for regressions" step for the thresholds and the
# noise data behind them, and DEVELOPMENT.md, "Criterion regression gate".

name: Bench regression

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Mondays at 04:00 UTC, before the 07:00 parity run: the github leg.
    # Keep both strings in step with the `github.event.schedule` checks below.
    - cron: '0 4 * * 1'
    # Nightly at 01:00 UTC: the pinned leg. Its timeout ends it by 02:30, well
    # before valve-guard.yml's 05:30 run on the same host.
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      base:
        description: "Base revision to compare against (default: see workflow header)"
        required: false
        default: ""

permissions:
  contents: read

# One run per PR: a new push cancels the old run. A `labeled` event for some
# other label gets its own group, so adding an unrelated label to a PR can't
# cancel a gate run in flight (that event's run skips the gate anyway). Each
# dispatch is its own group: two dispatches may name different bases.
concurrency:
  group: >-
    bench-regression-${{ github.event.pull_request.number || github.run_id }}${{
    github.event.action == 'labeled' && github.event.label.name != 'benchmark'
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolves the base revision (see the header) in a small job, so a week
  # with no new commits on main skips the bench job instead of failing it.
  base:
    name: Resolve base revision
    # PR: only with the `benchmark` label. A `labeled` event runs it only
    # when that label is `benchmark` (any other label changes nothing worth
    # re-benching). The nightly schedule: only while the pinned host exists.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 1 * * *'
       && vars.TYLERTOO_BENCH_RUNNER == 'true') ||
      (github.event_name == 'schedule' && github.event.schedule != '0 1 * * *') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'benchmark') ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled' &&
       contains(github.event.pull_request.labels.*.name, 'benchmark'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.base.outputs.sha }}
      hosts: ${{ steps.base.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve base revision
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          PINNED: ${{ vars.TYLERTOO_BENCH_RUNNER == 'true' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_BASE: ${{ inputs.base }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Which legs run: never the pinned one on a pull request.
          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" = "0 1 * * *" ]; then
            hosts='["pinned"]'
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$PINNED" = true ]; then
            hosts='["github","pinned"]'
          else
            hosts='["github"]'
          fi
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base=$(git merge-base "$PR_BASE_SHA" HEAD)
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" = "0 1 * * *" ]; then
            base=$(git rev-list -1 --before='1 day ago' HEAD)
            if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
              echo "::notice::no commits on main in the last day; nothing to compare"
              exit 0
            fi
          elif [ "$EVENT_NAME" = "schedule" ]; then
            base=$(git rev-list -1 --before='7 days ago' HEAD)
            if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
              echo "::notice::no commits on main in the last 7 days; nothing to compare"
              exit 0
            fi
          elif [ -n "$INPUT_BASE" ]; then
            base=$(git rev-parse --verify "${INPUT_BASE}^{commit}")
          elif [ "$REF_NAME" = "main" ]; then
            tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD^)
            base=$(git rev-parse --verify "${tag}^{commit}")
          else
            base=$(git merge-base origin/main HEAD)
          fi
          if [ "$base" = "$(git rev-parse HEAD)" ]; then
            echo "::error::base revision $base is HEAD itself; nothing to compare"
            exit 1
          fi
          echo "Comparing base $base -> head $(git rev-parse HEAD)"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

  criterion-regression:
    # The github leg keeps its old check name.
    name: Criterion regression gate${{ matrix.host == 'pinned' && ' (pinned host)' || '' }}
    needs: base
    if: needs.base.outputs.sha != ''
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.base.outputs.hosts) }}
    # A second guard: whatever the matrix says, a pull request runs on
    # ubuntu-latest, never on the self-hosted runner.
    runs-on: >-
      ${{ matrix.host == 'pinned' && github.event_name != 'pull_request'
      && fromJSON('["self-hosted","tylertoo-bench"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      TYLERTOO_BENCH_REQUIRE_FIXTURES: "1"
      CRITERION_HOME: ${{ github.workspace }}/target/criterion-compare
      # The pinned leg runs only `pipeline` (empty: the weekly list).
      CRITERION_BENCHES: ${{ matrix.host == 'pinned' && 'pipeline' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata/*.parquet
          key: fixtures-v1-${{ runner.os }}-${{ hashFiles('tests/fixtures/realdata/*.parquet') }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: |
          gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # Cached or downloaded, the fixtures must match benchmarks/fixtures.sha256.
      - name: Verify test fixtures
        run: scripts/ci/verify_fixtures.sh tests/fixtures/realdata

      # criterion_compare.sh reads the bench list through scripts/bench_list.py.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # The pinned host provides its own; sudo there may need a password.
      - name: Install protoc
        run: |
          command -v protoc >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          }

      # The pinned leg exists to time the column-split decode, which needs
      # read_decode_plan's cores / 4 / 2 read workers >= 2. The bench limits
      # rayon to one thread but not available_parallelism(), which the plan
      # reads; nothing here sets an affinity or RAYON_NUM_THREADS.
      - name: Check the pinned host's cores
        if: matrix.host == 'pinned'
        run: |
          cores=$(nproc)
          echo "available cores: $cores"
          if [ "$cores" -lt 16 ]; then
            echo "::error::the pinned leg needs >= 16 cores for the split decode; found $cores"
            exit 1
          fi

      # Own key: this job builds two revisions into one target dir. The weekly
      # run saves it from main, where label runs on PRs can restore it.
      # Criterion output goes to CRITERION_HOME, which criterion_compare.sh
      # wipes before running, so a restored target/ can't leak old results
      # into the comparison. Not on the pinned host: another architecture
      # and machine, and its builds are fast.
      - name: Cache cargo
        if: matrix.host == 'github'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-regression-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-regression-

      - name: Run benches at base, then head
        env:
          BASE_SHA: ${{ needs.base.outputs.sha }}
        run: |
          rm -rf target/criterion target/criterion-compare
          scripts/criterion_compare.sh "$BASE_SHA"
        timeout-minutes: 75

      # Thresholds, from measured noise (#678). Four A/A runs on this job
      # (38776884521, 38776888984, 38777309254, 38784871499: no benched code
      # changed between the two sides), 52 benches each, 208 comparisons:
      #   |change| median 1.0%, p90 4.9%, p95 6.5%, max 26.9%.
      #   CI lower bound: max +6.1% outside the Sutherland–Hodgman benches.
      #   Inside them: +26.2% (wide_polygon_clip/sutherland_hodgman/316000),
      #   +14.9% (sutherland_hodgman/316000), +14.2% (sutherland_hodgman/
      #   1000), +12.5% (wide_polygon_clip/sutherland_hodgman/10000), each
      #   with an interval under 3 points wide.
      # Criterion's interval only covers noise within one run, and some
      # benches move between runs of the same code. The old flat +25% failed
      # the fourth run on no change. Hence: fail at a +10% lower bound, and
      # +50% (about twice the worst A/A result) for the noisy globs, a
      # backstop for gross regressions only; CodSpeed's instruction counts
      # are the finer signal there.
      # Replayed on #432 (overflow checks in release, 36328559030), this
      # fails clip_geometry/100000 at +12.9%; the old +25% passed it.
      # The noisy globs and the measurements behind each are the [noisy]
      # entries in ci/exemptions.toml (#810), not this file.
      # Re-measure with A/A dispatches (a branch whose only change is outside
      # the benched code) before tightening further.
      - name: Check for regressions
        run: |
          set -euo pipefail
          noisy=$(scripts/bench_list.py noisy)
          mapfile -t globs <<<"$noisy"
          python3 scripts/criterion_gate.py --check \
            --criterion-dir "$CRITERION_HOME" --baseline base --warn 10 --fail 10 \
            "${globs[@]/#/--noisy=}" \
            --noisy-fail 50 --markdown "$CRITERION_HOME/report.md"

      - name: Job summary
        if: always()
        env:
          BASE_SHA: ${{ needs.base.outputs.sha }}
          HOST: ${{ matrix.host == 'pinned' && ' on the 64-core pinned host' || ' on ubuntu-latest (4 cores)' }}
        run: |
          [ -f "$CRITERION_HOME/report.md" ] || exit 0
          {
            echo "## Criterion$HOST: \`${BASE_SHA:0:10}\` → \`$(git rev-parse --short=10 HEAD)\`"
            echo
            cat "$CRITERION_HOME/report.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-regression-report-${{ matrix.host }}
          path: target/criterion-compare/

  # Weekly run: one comment with the table on the pinned tracking issue, so
  # the history is in one place and nobody has to open job summaries.
  # Posted whether or not the gate failed; a failure is the interesting week.
  # Nightly run (pinned host): the same comment on that host's own issue,
  # only on a failing night, so the 4- and 64-core tables never share one.
  report:
    name: Post the scheduled table
    needs: [base, criterion-regression]
    if: >-
      always() && github.event_name == 'schedule'
      && (needs.criterion-regression.result == 'failure'
          || (needs.criterion-regression.result == 'success'
              && github.event.schedule != '0 1 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # No artifact when the bench job failed before writing any results
      # (fixture download, protoc, the build): carry on, so the comment
      # below still posts that week's failed run and its link.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: criterion-regression-report-${{ github.event.schedule == '0 1 * * *' && 'pinned' || 'github' }}
          path: report

      - name: Comment on the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_SHA: ${{ needs.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
          RESULT: ${{ needs.criterion-regression.result }}
          NIGHTLY: ${{ github.event.schedule == '0 1 * * *' }}
        run: |
          TITLE="Weekly benchmark comparison"
          BODY="Each Monday, bench-regression.yml runs the criterion benches at
          last week's main and at today's on one runner, and comments the table
          here. Numbers within a table are comparable; numbers across weeks are
          from different runners and are not.

          To dig into a week: \`scripts/criterion_compare.sh <base>\` locally
          (DEVELOPMENT.md, \"Criterion regression gate\").

          ---
          _Managed by .github/workflows/bench-regression.yml; it comments,
          never edits this text._"
          if [ "$NIGHTLY" = true ]; then
            TITLE="Nightly pipeline benchmark (64-core host)"
            BODY="Each night, bench-regression.yml runs the \`pipeline\` bench at
          yesterday's main and at today's on the 64-core pinned host, and
          comments the table here when the gate fails. Never compare these
          numbers with the weekly 4-core table.

          ---
          _Managed by .github/workflows/bench-regression.yml; it comments,
          never edits this text._"
          fi

          if [ -f report/report.md ]; then
            TABLE=$(cat report/report.md)
          else
            TABLE="_No table: the run failed before the gate step._"
          fi
          COMMENT="### \`${BASE_SHA:0:10}\` → \`${HEAD_SHA:0:10}\` (gate: $RESULT)

          $TABLE

          Run: $RUN_URL"

          # Match on the exact title, not the label: `benchmark` also labels
          # PRs and other issues.
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -z "$EXISTING" ]; then
            NEW_URL=$(gh issue create --title "$TITLE" --label benchmark --body "$BODY")
            EXISTING=${NEW_URL##*/}
            # Pin the weekly issue so it stays visible (best effort; needs no
            # extra scope). The nightly one opens only on failures: not pinned.
            if [ "$NIGHTLY" != true ]; then
              ISSUE_ID=$(gh api "repos/$GH_REPO/issues/$EXISTING" --jq .node_id)
              # shellcheck disable=SC2016  # $id is a GraphQL variable, not shell
              gh api graphql -f query='
                mutation($id: ID!) { pinIssue(input: {issueId: $id}) { issue { number } } }' \
                -f id="$ISSUE_ID" || true
            fi
          fi
          gh issue comment "$EXISTING" --body "$COMMENT"
