# Gate canaries and staleness (#779): prove every gate can still go red,
# and that no scheduled gate has gone red or silent unnoticed.
#
# Why. Gates in this repo went vacuous or stayed red with nobody noticing:
# the weekly mutation sweep was red for 15 weeks (#419, #635, #677); the
# pre-commit clippy check was swallowed by a `| tail` pipe (#695); the
# bench gate ran 1 time in 166 runs (#678); the leaf-directory verify
# passed whenever pmtiles was absent; the fuzz nightly stayed green by
# holding 4 targets out. A green check proves nothing unless the check can
# fail.
#
# canary     one matrix job per ci/canaries/*.patch, picked up from the
#            directory with no edit here. Each job checks out main, applies
#            and commits the patch (the regression the gate exists to
#            catch), runs the gate command named in the patch's
#            `# gate:` header, and FAILS IF THE GATE PASSES, or if it fails
#            for a reason other than the patch's `# expect:` regex, or if
#            the patch no longer applies (a rotted canary).
#            scripts/ci/canary.py is the runner; ci/canaries/README.md has
#            the format and how to add one.
# staleness  scripts/ci/staleness.py: fails when a scheduled workflow's
#            last successful scheduled run is older than 8 days, when an
#            auto-filed gate issue (fuzz, mutation-tests, security-audit,
#            tippecanoe-parity, gate-canary) has been open more than 7
#            days, or when fuzz.yml's FUZZ_HOLDOUTS links a closed issue or
#            disagrees with fuzz/fuzz_targets/.
# notify     on a scheduled or dispatched failure, opens (or updates) one
#            pinned issue labelled `gate-canary`, the way fuzz.yml does.
#            The issue closes only after a full green scheduled run.
#
# Runs nightly after the fuzz run, on dispatch (optionally one canary by
# name), and on PRs that change a canary or the runner, so a new canary is
# proven red before it lands. Not a required check: a canary going green
# is a finding about main, not about the PR that happens to be open.

name: Gate canaries

on:
  schedule:
    # Every day at 04:30 UTC, after the 03:00 fuzz run.
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only the canaries whose name contains this (empty: all)'
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - 'ci/canaries/**'
      - 'scripts/ci/canary.py'
      - '.github/workflows/gate-canary.yml'

permissions:
  contents: read

concurrency:
  group: gate-canary-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  list:
    name: List canaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # Parses every header, so a malformed canary fails here, by name.
      - name: Every ci/canaries/*.patch, as a matrix
        id: list
        env:
          ONLY: ${{ inputs.only }}
        run: |
          matrix=$(uv run scripts/ci/canary.py list)
          if [ -n "$ONLY" ]; then
            matrix=$(jq -c --arg only "$ONLY" '{include: [.include[] | select(.name | contains($only))]}' <<< "$matrix")
          fi
          if [ "$(jq '.include | length' <<< "$matrix")" -eq 0 ]; then
            echo "::error::no canary matches '${ONLY}'"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq -r '.include[] | "  \(.name)  (\(.patch))"' <<< "$matrix"

  canary:
    name: Canary ${{ matrix.name }}
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cache test fixtures
        id: fixture-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/realdata/*.parquet
          key: fixtures-v1-${{ runner.os }}-${{ hashFiles('tests/fixtures/realdata/*.parquet') }}

      - name: Download test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: gh release download fixtures-v1 --dir tests/fixtures/realdata/ --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # Restore only: main's Check job owns these caches (ci.yml, CACHES).
      - name: Restore cargo registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore cargo build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-build-target-

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # Optional tools a canary asks for with `# setup:`.
      - name: Install tippecanoe build deps
        if: matrix.tippecanoe
        run: sudo apt-get install -y libsqlite3-dev zlib1g-dev

      - name: Cache tippecanoe
        if: matrix.tippecanoe
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/tippecanoe-*
            .tools/src-*
          key: tippecanoe-${{ hashFiles('benchmarks/e2e/setup_tippecanoe.sh') }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build tippecanoe (pinned tag + SHA) and put it on PATH
        if: matrix.tippecanoe
        run: |
          benchmarks/e2e/setup_tippecanoe.sh
          eval "$(benchmarks/e2e/setup_tippecanoe.sh --print-path)"
          dirname "$TIPPECANOE_BIN" >> "$GITHUB_PATH"

      - name: Install go-pmtiles (pinned, checksummed) and put it on PATH
        if: matrix.go_pmtiles
        run: |
          scripts/setup_go_pmtiles.sh
          eval "$(scripts/setup_go_pmtiles.sh --print-path)"
          dirname "$PMTILES_BIN" >> "$GITHUB_PATH"

      - name: Apply the canary and require its gate to go red
        env:
          PATCH: ${{ matrix.patch }}
        run: |
          git config user.name "gate-canary"
          git config user.email "gate-canary@users.noreply.github.com"
          uv run scripts/ci/canary.py run "$PATCH"

  staleness:
    name: Gate staleness
    # On PRs the state of main's schedules says nothing about the PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      report: ${{ steps.staleness.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Stale schedules, stale gate issues, stale fuzz hold-outs
        id: staleness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          uv run scripts/ci/staleness.py > staleness.txt
          code=$?
          set -e
          cat staleness.txt
          {
            echo "report<<STALENESS_EOF_$GITHUB_RUN_ID"
            cat staleness.txt
            echo "STALENESS_EOF_$GITHUB_RUN_ID"
          } >> "$GITHUB_OUTPUT"
          exit "$code"

  notify:
    name: Open or update the gate-canary issue
    needs: [list, canary, staleness]
    if: >-
      always() && github.event_name != 'pull_request'
      && (needs.list.result == 'failure' || needs.canary.result == 'failure'
          || needs.staleness.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      # `gh run view --json jobs` lists this run's jobs to name the failures.
      actions: read
    steps:
      - name: Open or update the gate-canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STALENESS: ${{ needs.staleness.outputs.report }}
        run: |
          gh label create gate-canary \
            --description "Automated gate self-test (canary) or staleness failures" \
            --color B60205 2>/dev/null || true

          FAILED=$(gh run view "$GITHUB_RUN_ID" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure" and .name != "Open or update the gate-canary issue") | .name] | join(", ")')

          TITLE="Gate canary or staleness check is failing"
          BODY="The nightly gate self-test found a gate that cannot fail, or a scheduled gate that has gone red or silent.

          Failing jobs: ${FAILED:-(see the run)}

          Run: $RUN_URL

          A failing \`Canary <name>\` job means one of three things, and its log says which:
          - the gate PASSED with ci/canaries/<name>.patch applied: the gate is vacuous; fix the gate, not the canary;
          - the gate failed for another reason than the canary's \`# expect:\`: it proved nothing;
          - the patch no longer applies: regenerate it against main (ci/canaries/README.md).

          Staleness:
          \`\`\`
          ${STALENESS:-(the staleness job did not report)}
          \`\`\`

          ---
          _This issue is managed by .github/workflows/gate-canary.yml. It is
          updated (not duplicated) on every failing run. Close it only after a
          full green scheduled run (every canary and the staleness job), never
          after a dispatched subset. The staleness job itself fails while this
          issue stays open past 7 days._"

          EXISTING=$(gh issue list --label gate-canary --state open \
            --json number,title \
            --jq 'map(select(.title == "Gate canary or staleness check is failing")) | .[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue edit "$EXISTING" --body "$BODY"
            gh issue comment "$EXISTING" --body "Still failing as of $RUN_URL (jobs: ${FAILED:-see the run})"
          else
            echo "Opening new issue"
            NEW_URL=$(gh issue create --title "$TITLE" --label gate-canary --body "$BODY")
            NUM=${NEW_URL##*/}
            ISSUE_ID=$(gh api "repos/$GH_REPO/issues/$NUM" --jq .node_id)
            # shellcheck disable=SC2016  # $id is a GraphQL variable, not shell
            gh api graphql -f query='
              mutation($id: ID!) { pinIssue(input: {issueId: $id}) { issue { number } } }' \
              -f id="$ISSUE_ID" || true
          fi
