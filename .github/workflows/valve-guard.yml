# Size-valve wall and RSS guard (#792, #772) — nightly, not a required check.
#
# benchmarks/valve_guard.py times the cells the size valve regressed on and
# fails when merge:drop on #792 passes 1.8x wall or 1.5x peak RSS. The limits
# were measured at 64 cores and at 4 cores (taskset -c 0-3, as on ubuntu-latest):
# 6c3cec4 reads 2.0-2.1x wall at both, the fixed code 1.45-1.64x at both. The
# ratio does move with core count, so these are not machine independent;
# re-measure if the runner changes shape.
# The cell-by-cell comparison with benchmarks/baseline/valve_guard.json
# (15% slower, 20% heavier) applies only when the runner matches the host the
# baseline was recorded on (the script compares CPU model and count).
#
# Two hosts (#810), one matrix leg each:
#   github  ubuntu-latest (x86, 4 cores): the merge:drop ratio half only.
#   pinned  the maintainer's 64-core VM, a self-hosted runner labelled
#           `tylertoo-bench`, where the baseline was recorded: both halves.
#           The leg exists only while the repository variable
#           TYLERTOO_BENCH_RUNNER is "true", so nothing queues for a runner
#           that is not registered. This workflow triggers only on schedule
#           and workflow_dispatch, never on pull_request, so the self-hosted
#           runner never runs code from a fork.
#
# The #792 input is 238 MB of shapefile, too large to commit. It is rebuilt
# from the public download (Bayern's Hausumringe, Niederbayern) with the
# duckdb step in benchmarks/prepare_792.py, and cached between runs under a
# key that names the source URL and the script, so a night spends minutes on
# the guard, not on the download. Moldova comes from the bench-coalesce-v1
# release, checked against the manifest's sha256.
#
# Input failures and guard failures open or update separate issues, one set
# per host.

name: Valve guard

on:
  schedule:
    # 05:30 UTC: after the 03:00 fuzz run and the Monday 04:00 criterion run.
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SRC_792_URL: https://geodaten.bayern.de/odd/m/3/daten/hausumringe/bezirk/data/092_Niederbayern_Hausumringe.zip
  SRC_792_SHA256: 6007be46c1a0cda43604a71139a735c0fa8920048cba85dc19182dc13d835d4c
  MOLDOVA_URL: https://github.com/geoparquet-io/tylertoo/releases/download/bench-coalesce-v1/moldova-hilbert.parquet
  MOLDOVA_SHA256: 06bddb7a42283812c1032d85a6b138daf198b1b46592ba96ad84cbe09a12e5f5
  DUCKDB: duckdb==1.5.4
  DATA: ${{ github.workspace }}/bench-data

jobs:
  guard:
    name: Valve guard (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(vars.TYLERTOO_BENCH_RUNNER == 'true' && '["github","pinned"]' || '["github"]') }}
    runs-on: ${{ matrix.host == 'pinned' && fromJSON('["self-hosted","tylertoo-bench"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    # issues: the last step opens or updates this host's failure issue.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # The pinned host provides its own; sudo there may need a password.
      - name: Install protoc
        run: |
          command -v protoc >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y protobuf-compiler
          }

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-valve-guard-${{ hashFiles('Cargo.lock') }}

      - name: Restore the #792 input
        id: cache-792
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, restore sub-path
        with:
          path: ${{ env.DATA }}/792
          key: valve-guard-792-${{ env.SRC_792_SHA256 }}-${{ hashFiles('benchmarks/prepare_792.py') }}-${{ env.DUCKDB }}

      - name: Rebuild the #792 input from the public download
        id: prepare-792
        if: steps.cache-792.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        run: |
          failure="$SRC_792_URL: download failed (expected SHA-256 $SRC_792_SHA256)"
          trap 'echo "::error title=Valve guard input unavailable::$failure"; echo "error=$failure" >> "$GITHUB_OUTPUT"' ERR
          mkdir -p "$DATA/792/dl"
          curl --fail --location --retry 3 -o "$DATA/792/dl/src.zip" "$SRC_792_URL"
          got=$(sha256sum "$DATA/792/dl/src.zip")
          got=${got%% *}
          failure="$SRC_792_URL: SHA-256 mismatch (expected $SRC_792_SHA256, got $got)"
          test "$got" = "$SRC_792_SHA256"
          failure="$SRC_792_URL: unpack/prepare failed (verified SHA-256 $got); see the prepare step log"
          unzip -q -o "$DATA/792/dl/src.zip" -d "$DATA/792/shp"
          uv run --with "$DUCKDB" python -I benchmarks/prepare_792.py \
            "$DATA/792/shp/hausumringe.shp" "$DATA/792/buildings.parquet"
          rm -rf "$DATA/792/dl" "$DATA/792/shp"

      - name: Save the #792 input
        if: steps.cache-792.outputs.cache-hit != 'true' && steps.prepare-792.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, save sub-path
        with:
          path: ${{ env.DATA }}/792
          key: ${{ steps.cache-792.outputs.cache-primary-key }}

      - name: Restore the Moldova input
        id: cache-moldova
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, restore sub-path
        with:
          path: ${{ env.DATA }}/coalesce/inputs
          key: valve-guard-moldova-${{ env.MOLDOVA_SHA256 }}

      - name: Fetch Moldova
        id: prepare-moldova
        if: steps.cache-moldova.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        run: |
          failure="$MOLDOVA_URL: download failed (expected SHA-256 $MOLDOVA_SHA256)"
          trap 'echo "::error title=Valve guard input unavailable::$failure"; echo "error=$failure" >> "$GITHUB_OUTPUT"' ERR
          mkdir -p "$DATA/coalesce/inputs"
          curl --fail --location --retry 3 -o "$DATA/coalesce/inputs/moldova-hilbert.parquet" "$MOLDOVA_URL"
          got=$(sha256sum "$DATA/coalesce/inputs/moldova-hilbert.parquet")
          got=${got%% *}
          failure="$MOLDOVA_URL: SHA-256 mismatch (expected $MOLDOVA_SHA256, got $got)"
          test "$got" = "$MOLDOVA_SHA256"

      - name: Save the Moldova input
        if: steps.cache-moldova.outputs.cache-hit != 'true' && steps.prepare-moldova.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, save sub-path
        with:
          path: ${{ env.DATA }}/coalesce/inputs
          key: ${{ steps.cache-moldova.outputs.cache-primary-key }}

      - name: Check input readiness
        id: inputs
        env:
          INPUT_792_OK: ${{ steps.cache-792.outputs.cache-hit == 'true' || steps.prepare-792.outcome == 'success' }}
          INPUT_MOLDOVA_OK: ${{ steps.cache-moldova.outputs.cache-hit == 'true' || steps.prepare-moldova.outcome == 'success' }}
          INPUT_792_ERROR: ${{ steps.prepare-792.outputs.error }}
          INPUT_MOLDOVA_ERROR: ${{ steps.prepare-moldova.outputs.error }}
        run: |
          if [ "$INPUT_792_OK" = true ] && [ "$INPUT_MOLDOVA_OK" = true ]; then
            echo "input_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "input_ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "input_error<<INPUT_ERRORS"
              echo "$INPUT_792_ERROR"
              echo "$INPUT_MOLDOVA_ERROR"
              echo "INPUT_ERRORS"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Build the CLI on mimalloc and on glibc
        if: steps.inputs.outputs.input_ok == 'true'
        run: |
          cargo build --release --locked -p tylertoo
          cp target/release/tylertoo "$RUNNER_TEMP/tylertoo-mim"
          cargo build --release --locked -p tylertoo --no-default-features --target-dir target/glibc
          cp target/glibc/release/tylertoo "$RUNNER_TEMP/tylertoo-glibc"

      - name: Check the valve
        id: guard
        if: steps.inputs.outputs.input_ok == 'true'
        shell: bash
        run: |
          uv run python -I benchmarks/valve_guard.py check \
            --mim "$RUNNER_TEMP/tylertoo-mim" --glibc "$RUNNER_TEMP/tylertoo-glibc" \
            --data "$DATA" --json-out "$RUNNER_TEMP/valve-guard.json" \
            | tee "$RUNNER_TEMP/valve-guard.txt"

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: valve-guard-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/valve-guard.json
            ${{ runner.temp }}/valve-guard.txt
          if-no-files-found: warn

      - name: Open or update the issue
        if: always() && (steps.inputs.outputs.input_ok == 'false' || steps.guard.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INPUT_OK: ${{ steps.inputs.outputs.input_ok }}
          INPUT_ERROR: ${{ steps.inputs.outputs.input_error }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          HOST: ${{ matrix.host == 'pinned' && ' (pinned host)' || '' }}
        run: |
          gh label create benchmark \
            --description "Benchmark lane" \
            --color 0E8A16 2>/dev/null || true

          create_or_update() {
            local title="$1" body="$2" kind="$3" existing
            existing=$(gh issue list --label benchmark --state open \
              --json number,title \
              --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body "$body" --add-label "P2,$kind"
              gh issue comment "$existing" --body "Still failing as of $RUN_URL"
            else
              gh issue create --title "$title" --label "benchmark,P2,$kind" --body "$body"
            fi
          }

          if [ "$INPUT_OK" = false ]; then
            BODY="Impact: P2. The nightly valve guard cannot check performance when
          a benchmark input cannot be downloaded, verified, or prepared.
          Workaround: repoint the input URL and SHA-256 in this workflow.

          This is not a valve regression. Input preparation failed:
          $INPUT_ERROR

          Run: $RUN_URL

          For #792, repoint SRC_792_URL to an accessible copy of the source zip
          and set SRC_792_SHA256 to that copy's verified SHA-256. For Moldova,
          update MOLDOVA_URL and MOLDOVA_SHA256. Commit the workflow change
          and rerun Valve guard; changing the SHA-256 selects a new cache key.

          _Managed by .github/workflows/valve-guard.yml. Close after inputs recover._"
            create_or_update "Valve guard input is unavailable$HOST" "$BODY" bug
          fi

          if [ "$GUARD_OUTCOME" = failure ]; then
            BODY="Impact: P2. The nightly performance check failed; users exporting
          the benchmark workloads may see higher wall time or peak RSS.
          Workaround: inspect the measurements and reproduce as shown below.

          The scheduled valve guard (benchmarks/valve_guard.py) failed.
          Inspect its output for the failing check or command:
          merge:drop on the #792 export passed 1.8x wall or 1.5x peak RSS, a
          cell regressed against its baseline, or the guard could not complete
          its measurements.

          Run: $RUN_URL

          The \`valve-guard-<host>\` artifact has the measurements and the guard's
          output. To reproduce on a quiet machine:

          \`\`\`
          cargo build --release -p tylertoo
          cargo build --release -p tylertoo --no-default-features --target-dir target/glibc
          uv run python -I benchmarks/valve_guard.py check \\
            --mim target/release/tylertoo --glibc target/glibc/release/tylertoo
          \`\`\`

          ---
          _Managed by .github/workflows/valve-guard.yml. Updated, not
          duplicated, on every failing night. Close it after a green night._"
            create_or_update "Nightly valve guard is failing$HOST" "$BODY" optimization
          fi
