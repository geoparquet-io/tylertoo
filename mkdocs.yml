site_name: tylertoo
site_description: GeoParquet to PMTiles, with queryable multi-resolution overviews
site_author: Nissim Lebovits
site_url: https://geoparquet-io.github.io/tylertoo/
repo_name: geoparquet-io/tylertoo
repo_url: https://github.com/geoparquet-io/tylertoo
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/geoparquet-io/tylertoo
      name: tylertoo on GitHub

plugins:
  - search

# Strict builds (`zensical build --strict`) fail on these.
validation:
  links:
    not_found: warn
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  # The home page and tutorials are includes of README.md and
  # examples/*/README.md, so each has one source of truth.
  - pymdownx.snippets:
      base_path: .
      check_paths: true
  - tables
  - toc:
      permalink: true

# Kept in the repo but out of the nav (developer-facing):
# architecture.md, PROFILING.md, development.md.
not_in_nav: |
  /architecture.md
  /PROFILING.md
  /development.md

nav:
  - Home: index.md
  - Tutorials:
      - Madagascar boundaries: tutorials/madagascar.md
      - Brazil fields from the cloud: tutorials/brazil.md
  - Guides:
      - Scaling: guides/scaling.md
      - Remote reads: guides/remote-reads.md
      - Coming from tippecanoe: guides/tippecanoe.md
  - Demo: demo.md
  - Reference:
      - reference/index.md
      - CLI: reference/cli.md
      - Python: reference/python.md
      - Rust: reference/rust.md
      - Tuning knobs: OVERVIEW_TUNING.md
  - Contributing: contributing.md
  - Changelog: changelog.md
