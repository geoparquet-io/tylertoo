# cargo-deny configuration — supply-chain policy for the workspace.
# Run locally with: cargo deny check
# CI: Security Audit job (every PR) + weekly scheduled security workflow.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Keep this list as short as possible. Earlier exceptions were all resolved by
# dependency bumps rather than waived: arrow 59 dropped `paste`, indicatif 0.18
# dropped `number_prefix`, and object_store 0.14 reached quick-xml 0.41 and
# dropped rustls-pemfile. cargo-deny warns on an ignore that matches nothing,
# so a stale entry here is not silent.
#
# zstd 0.13.3 / zstd-safe 7.3.0 (2026-10-27). The fixes ship only in zstd
# 0.14.3 / zstd-safe 8.2.0, and parquet 59 requires `zstd = "^0.13"`. Only
# parquet 60 moves to 0.14, and the arrow stack stays on 59 until geoarrow and
# geoparquet support arrow 60 (see the workspace Cargo.toml).
# RUSTSEC-2026-0410 (zstd-sys wasm allocator shim) is fixed by zstd-sys 2.1.2,
# a semver-compatible lockfile bump, so it is not waived. The only zstd callers
# in the tree are parquet's `ZSTDCodec`, which uses `zstd::bulk::{Compressor,
# Decompressor}` (one-shot compress2/decompress per page), and
# tylertoo-core's `compression.rs`, which uses `zstd::encode_all` and
# `zstd::stream::read::Decoder::new`.
# Expires: drop these entries when the arrow/parquet 60 bump lands, and
# re-check them by 2027-01-31 either way. Neither cargo-deny nor cargo-audit
# has an expiry field, so this date is a review date, not an enforced one.
# Mirrored in .cargo/audit.toml, because cargo-audit does not read this file.
ignore = [
    # Stream `with_context` constructors reuse a context without resetting
    # it. Nothing in the tree calls `with_context`. Parquet's bulk API and
    # our `encode_all` / `read::Decoder::new` each start on a fresh or
    # session-reset context.
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 pinned by parquet 59; no caller uses the affected with_context constructors" },
    # `Seekable::decompress`. The `seekable` feature is off: zstd's enabled
    # features are arrays, legacy, std and zdict_builder, so the type is not
    # compiled.
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7 pinned via parquet 59; seekable feature not enabled" },
    # A failed legacy-frame `DCtx::decompress_stream` extends a `Vec<u8>`
    # destination over uninitialized memory. Legacy decoding is on by
    # default, and we decode untrusted tiles and GeoParquet pages. The
    # affected path is `zstd::stream::write::Decoder`, or `decompress_stream`
    # into a Vec, and nothing here uses it. Our reader is
    # `stream::read::Decoder`, which writes into a `&mut [u8]` slice and
    # returns the error. Parquet uses the bulk API. The advisory lists both
    # as not affected.
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7 pinned via parquet 59; only read::Decoder and bulk APIs are used, which the advisory lists as unaffected" },
]

[licenses]
version = 2
# Allowlist derived from the actual dependency tree (2026-07). Everything here
# is permissive / weak-copyleft-free. Notably absent on purpose: GPL/LGPL/AGPL,
# MPL, SSPL, BUSL. (r-efi is triple-licensed MIT OR Apache-2.0 OR
# LGPL-2.1-or-later; cargo-deny satisfies it via MIT.)
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # A DATA license, not a code one: webpki-root-certs ships Mozilla's CA
    # list under it (via object_store -> reqwest -> rustls-platform-verifier).
    # CDLA-Permissive-2.0 dropped 1.0's attribution requirements and carries no
    # copyleft or share-alike -- that is the separate CDLA-Sharing variant. Not
    # OSI-listed, because OSI does not evaluate data licenses at all.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate crate versions are common in the arrow ecosystem; keep as warning.
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
