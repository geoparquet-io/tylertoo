# Prose rules for tylertoo's handwritten documentation.
#
# Ported from nlebovits/geodata-llm-eval, whose custom styles adapt the
# portolan-sdi/portolan-ops prose rules (see .vale/styles/NOTICE). Google
# and Microsoft supply the developer-documentation baseline; Readability
# reports document-level metrics as suggestions. The files in scope are
# listed in scripts/lint-prose.sh, which the pre-commit hook and CI share.

StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Tylertoo
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip, https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip, https://github.com/vale-cli/readability/releases/download/v0.2.0/Readability.zip

[*.md]
BasedOnStyles = Vale, Tylertoo-Terms, Tylertoo-Mechanics, Tylertoo-Voice, Tylertoo-Docs, Google, Microsoft, Readability

# No TokenIgnores: geodata-llm-eval's patterns for inline code, paths, and
# kebab-case names made Vale 3.24 lint the inside of matching code spans
# (Vale.Terms flagged `tylertoo export-pmtiles`). Vale already skips code;
# write file paths and identifiers in backticks instead.

# Disables carried over from geodata-llm-eval: these Microsoft and Google
# rules duplicate a Tylertoo-* rule, conflict with house conventions, or
# misfire on technical prose.
Microsoft.Contractions = NO
Microsoft.Dashes = NO
Microsoft.Ellipses = NO
Microsoft.FirstPerson = NO
# Flags the same e.g./i.e. as Google.Latin; one alert per finding is enough.
Microsoft.Foreign = NO
Microsoft.GeneralURL = NO
Microsoft.HeadingColons = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Headings = NO
Microsoft.OxfordComma = NO
Microsoft.Passive = NO
Microsoft.Quotes = NO
Microsoft.Semicolon = NO
Microsoft.SentenceLength = NO
Microsoft.Terms = NO
Microsoft.Uppercase = NO
Microsoft.Vocab = NO
Google.Acronyms = NO
Google.Colons = NO
Google.Contractions = NO
Google.Ellipses = NO
Google.EmDash = NO
Google.FirstPerson = NO
Google.Headings = NO
Google.LyHyphens = NO
Google.OxfordComma = NO
Google.Parens = NO
Google.Passive = NO
Google.Quotes = NO
Google.We = NO
Google.WordList = NO
Google.WordListCase = NO

# ARI and Flesch Reading Ease show a trend; the other formulas repeat it.
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO
# Readability v0.2.0 added a per-word polysyllable count. Every product
# name (tylertoo, GeoParquet) trips it; ~2000 alerts with no editorial use.
Readability.Polysyllables = NO
