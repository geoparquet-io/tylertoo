[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/python",
]
# The #205 wagyu-rs evaluation runner has its own dependency graph: wagyu-rs
# 0.2.1's dead `geo = "0.32"` dependency cannot resolve beside our geo 0.33
# (both pin a different i_overlay 4.x). See corpus/hostile_wagyu/Cargo.toml.
exclude = ["corpus/hostile_wagyu"]

[workspace.package]
version = "0.11.0"
edition = "2021"
# Dependency-driven, not a policy choice: geoarrow/geoparquet 0.9 declare 1.95,
# and cargo refuses to build a dependency whose rust-version exceeds ours. The
# MSRV CI job verifies this number by building with exactly this toolchain, so
# it cannot drift the way "1.75" silently did (by then the real floor was 1.95).
rust-version = "1.95"
authors = ["Nissim Lebovits <nlebovits@pm.me>"]
license = "Apache-2.0"
repository = "https://github.com/geoparquet-io/tylertoo"
homepage = "https://github.com/geoparquet-io/tylertoo"
keywords = ["geoparquet", "pmtiles", "vector-tiles", "mvt", "geospatial"]
categories = ["science", "data-structures", "encoding"]

[workspace.dependencies]
# Internal crates
tylertoo-core = { path = "crates/core", version = "0.11.0" }

# Core geospatial dependencies
geoarrow = "0.9"
geoarrow-array = "0.9"
geo-traits = "0.3"
geoparquet = "0.9"
# arrow-rs is pinned to 59 by the geoarrow stack above, NOT by choice: geoarrow
# 0.9 and geoparquet 0.9 declare `arrow-* = "^59"` / `parquet = "^59"`, which
# cargo cannot unify with 60.x. Moving these to 60 on their own links two arrow
# majors into one binary and breaks every type that crosses the geoparquet
# boundary (see #476, and the `ignore:` rationale in .github/dependabot.yml).
# Bump arrow-rs and geoarrow together, once geoarrow-rs supports arrow 60.
parquet = "59"
arrow-schema = "59"
arrow-array = "59"
arrow-select = "59"
arrow-ipc = "59"
arrow-cast = "59"
arrow-buffer = "59"
geo = "0.33"
geozero = { version = "0.15", features = ["with-wkb", "with-geo"] }

# Protobuf for MVT encoding
prost = "0.14"
prost-build = "0.14"

# Parallelism
rayon = "1.10"
crossbeam-channel = "0.5"

# CLI
clap = { version = "4", features = ["derive"] }

# Python bindings
pyo3 = { version = "0.29", features = ["extension-module"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
log = "0.4"
env_logger = "0.11"
indicatif = "0.18"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Memory profiling (actual RSS measurement)
memory-stats = "1.2"

# Property-based testing (dev only)
proptest = "1"

# Note: Install these separately with cargo install:
# - cargo-llvm-cov (coverage)
# - cargo-mutants (mutation testing)
# - cargo-watch (auto-run tests)

# Curated lint gates shared by every crate (each crate opts in with
# `[lints] workspace = true`). CI runs clippy with `-D warnings`, so every
# "warn" below is a hard failure on PRs. The full clippy::pedantic group is
# NOT enabled: current code has ~200 findings dominated by cast lints
# (cast_possible_truncation etc.) that are endemic to tile-coordinate math.
# The subset below is the curated slice that current code passes with zero
# findings — ratchet by adding lints here, not by editing CI.
[workspace.lints.clippy]
# Complexity gate: clippy default threshold (25); zero findings today.
# Tighten via `cognitive-complexity-threshold` in clippy.toml if desired.
cognitive_complexity = "warn"
# Function-length gate: see `too-many-lines-threshold` in clippy.toml.
too_many_lines = "warn"
# Pedantic subset (zero findings on current code)
filter_map_next = "warn"
flat_map_option = "warn"
from_iter_instead_of_collect = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_stack_arrays = "warn"
linkedlist = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
maybe_infinite_iter = "warn"
mut_mut = "warn"
option_option = "warn"
range_minus_one = "warn"
range_plus_one = "warn"
redundant_else = "warn"
ref_option_ref = "warn"
string_add_assign = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
zero_sized_map_values = "warn"
# Docs gates (CI denies warnings, so these are errors there). The Python
# API's docstrings live in crates/python/python and are ruff's job.
too_long_first_doc_paragraph = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Product and geometry-type names are prose, not code; clippy.toml lists
# them in `doc-valid-idents` so doc_markdown asks for backticks only on
# real identifiers.
doc_markdown = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
# Integer overflow is a bug, not a wrap (#432): a tile compiler that silently
# wraps writes wrong bytes, and the known bug class is "panics in debug,
# silently wrong in release". Hot loops are float-dominated, so the cost is
# low single-digit percent (measured on lines-portland-medium; see PR #432's
# body). Untrusted-input boundaries still use checked_*/typed errors: a panic
# there is a DoS, not a fix.
overflow-checks = true

# ...but only for workspace crates. `package."*"` matches non-workspace
# (dependency) crates only, so this leaves them at Cargo's release default:
# a third-party crate with a latent wrap that is benign for it would
# otherwise become a hard abort of the binary and a PanicException in the
# Python wheel, and we cannot fix or test those sites.
[profile.release.package."*"]
overflow-checks = false

[profile.bench]
inherits = "release"

# Build profile for cargo-mutants (.cargo/mutants.toml sets `profile =
# "mutants"`; nextest gets it as `--cargo-profile=mutants`). Every mutant
# recompiles tylertoo-core and relinks its test binaries, so this profile
# is tuned for that loop, not for debugging:
# - no debuginfo: the core test binaries were 4.6 GB of link output
#   under `test`, 1.1 GB here, and nobody attaches a debugger to a mutant.
# - workspace crates stay at opt-level 0 (inherited from `test`, with
#   overflow-checks and debug-assertions on, which is where many mutants
#   are caught). opt-level 1 was measured too: the quick tier ran 2x
#   faster but a real mutation's incremental rebuild got slower, and
#   builds dominate now that a caught mutant's tests stop within a second.
# - dependencies at opt-level 3 (`package."*"` matches non-workspace crates
#   only): built once per sweep/shard, then every test run of every mutant
#   is faster, since the real-data pipeline tests that bound the test
#   phase spend most of their time in arrow/parquet/geo.
[profile.mutants]
inherits = "test"
debug = 0
strip = "debuginfo"
incremental = true
codegen-units = 256

# codegen-units is NOT inherited here on purpose: 256 units is right for
# the per-mutant incremental rebuild of the workspace, but the
# dependencies are built once and run thousands of times, so they get
# release-style cross-function inlining.
[profile.mutants.package."*"]
opt-level = 3
codegen-units = 16
