[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/python",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
# Dependency-driven, not a policy choice: geoarrow/geoparquet 0.9 declare 1.95,
# and cargo refuses to build a dependency whose rust-version exceeds ours. The
# MSRV CI job verifies this number by building with exactly this toolchain, so
# it cannot drift the way "1.75" silently did (by then the real floor was 1.95).
rust-version = "1.95"
authors = ["Nissim Lebovits <nlebovits@pm.me>"]
license = "Apache-2.0"
repository = "https://github.com/geoparquet-io/tylertoo"
homepage = "https://github.com/geoparquet-io/tylertoo"
keywords = ["geoparquet", "pmtiles", "vector-tiles", "mvt", "geospatial"]
categories = ["science", "data-structures", "encoding"]

[workspace.dependencies]
# Internal crates
tylertoo-core = { path = "crates/core", version = "0.7.0" }

# Core geospatial dependencies
geoarrow = "0.9"
geoarrow-array = "0.9"
geo-traits = "0.3"
geoparquet = "0.9"
parquet = "59"
arrow-schema = "59"
arrow-array = "59"
arrow-select = "59"
arrow-ipc = "59"
arrow-cast = "59"
arrow-buffer = "59"
geo = "0.33"
geozero = { version = "0.15", features = ["with-wkb", "with-geo"] }

# Protobuf for MVT encoding
prost = "0.14"
prost-build = "0.14"

# Parallelism
rayon = "1.10"
crossbeam-channel = "0.5"

# CLI
clap = { version = "4", features = ["derive"] }

# Python bindings
pyo3 = { version = "0.29", features = ["extension-module"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
log = "0.4"
env_logger = "0.11"
indicatif = "0.18"

# Tracing / Profiling
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Memory profiling (actual RSS measurement)
memory-stats = "1.2"

# Property-based testing (dev only)
proptest = "1"

# Note: Install these separately with cargo install:
# - cargo-tarpaulin (coverage)
# - cargo-mutants (mutation testing)
# - cargo-watch (auto-run tests)

# Curated lint gates shared by every crate (each crate opts in with
# `[lints] workspace = true`). CI runs clippy with `-D warnings`, so every
# "warn" below is a hard failure on PRs. The full clippy::pedantic group is
# NOT enabled: current code has ~200 findings dominated by cast lints
# (cast_possible_truncation etc.) that are endemic to tile-coordinate math.
# The subset below is the curated slice that current code passes with zero
# findings — ratchet by adding lints here, not by editing CI.
[workspace.lints.clippy]
# Complexity gate: clippy default threshold (25); zero findings today.
# Tighten via `cognitive-complexity-threshold` in clippy.toml if desired.
cognitive_complexity = "warn"
# Function-length gate: see `too-many-lines-threshold` in clippy.toml.
too_many_lines = "warn"
# Pedantic subset (zero findings on current code)
filter_map_next = "warn"
flat_map_option = "warn"
from_iter_instead_of_collect = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_stack_arrays = "warn"
linkedlist = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
maybe_infinite_iter = "warn"
mut_mut = "warn"
option_option = "warn"
range_minus_one = "warn"
range_plus_one = "warn"
redundant_else = "warn"
ref_option_ref = "warn"
string_add_assign = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
zero_sized_map_values = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
