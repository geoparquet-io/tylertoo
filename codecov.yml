# Codecov reports; it does not gate. The coverage floor is the "Coverage
# floor" step of the CI Coverage job (scripts/coverage_gate.py, #678): the
# codecov/project status never posted here, so a target set below gated
# nothing. Keep `ignore:` in step with DEFAULT_IGNORE in that script.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "crates/cli/**"        # Don't require high coverage for CLI arg parsing
  - "crates/python/**"     # pyo3 bindings are integration-tested differently
  - "tests/**"
  - "benches/**"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
