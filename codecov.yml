# Native Codecov statuses use the same report, with separate crate targets.
coverage:
  status:
    project:
      default:
        target: 94%
        threshold: 0%
        informational: false
      core:
        target: 94%
        threshold: 0%
        paths:
          - "crates/core/"
        informational: false
      cli:
        target: 81.9%
        threshold: 0%
        paths:
          - "crates/cli/"
        informational: false
    patch:
      default:
        informational: true

ignore:
  - "crates/python/**"
  - "tests/**"
  - "benches/**"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
