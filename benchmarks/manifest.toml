# NZ parcels' z0-14 overview as track E1 built it for #739
# (`tylertoo overview nz-parcels-hilbert.parquet --min-zoom 0 --max-zoom 14`,
# glibc build of cb1bdfc): E1 saw export RSS move one way on Moldova and the
# other on NZ, so the allocator decision needs both.
[cells.export-nz]
label = "Export: NZ parcels z0-14 overview (E1's #739 input)"
tickets = [739]
input = "nz-overview-z14"
command = "export-pmtiles"
args = ["{input}", "{out}/out.pmtiles"]
output = "out.pmtiles"
allocator = "any"
# The #740 level store spills to $TMPDIR (about 13 GB here).
watch = "tmp"

# #715: the spill codec. Moldova verbatim z7-13 with spill forced, track C1's
# workload: a 1 MiB auto memory limit, --profile bounded and an explicit
# spill directory, whose size is sampled every 0.2 s (`watch`). Compares two
# builds of the spill writer, so it runs only when named.
[cells.spill-codec]
label = "Spill codec: FTW Moldova verbatim z7-13, spill forced"
tickets = [715]
input = "moldova"
command = "overview"
args = ["{input}", "{out}/ov.parquet"]
output = "ov.parquet"
zoom = [7, 13]
flags = ["--verbatim", "--profile", "bounded", "--spill-dir", "{out}/spill"]
# C1's exact command (788-C1 .788/BENCH-715.md): 8 rayon threads, and the ipc
# debug log, which carries each spill stream's encoded bytes. The codec binary
# takes its selector per binary: --bin-env lz4:TYLERTOO_SPILL_IPC_COMPRESSION=lz4.
env = { TYLERTOO_AUTO_MEM_LIMIT_BYTES = "1048576", RAYON_NUM_THREADS = "8", RUST_LOG = "info,tylertoo_io::ipc=debug" }
watch = "spill"
heavy = true

# #734: the convert/export split at the scale #535 measured. Hours, not
# minutes: one round unless the lead asks for more.
[cells.brazil-55m]
label = "Brazil 55.5M: every FTW state, tiles z0-13, bounded (#535 / #734)"
tickets = [734]
inputs = ["ftw-br-ac", "ftw-br-al", "ftw-br-am", "ftw-br-ap", "ftw-br-ba", "ftw-br-ce",
          "ftw-br-df", "ftw-br-es", "ftw-br-go", "ftw-br-ma", "ftw-br-mg", "ftw-br-ms",
          "ftw-br-mt", "ftw-br-pa", "ftw-br-pb", "ftw-br-pe", "ftw-br-pi", "ftw-br-pr",
          "ftw-br-rj", "ftw-br-rn", "ftw-br-ro", "ftw-br-rr", "ftw-br-rs", "ftw-br-sc",
          "ftw-br-se", "ftw-br-sp", "ftw-br-to"]
command = "tiles"
args = ["{out}/out.pmtiles"]
output = "out.pmtiles"
zoom = [0, 13]
flags = ["--files-from", "{files_from}", "--profile", "bounded"]
wall_s = 14400
pairs = 1
heavy = true

