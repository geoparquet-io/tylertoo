# The workload manifest (#734): every timed workload of the benchmark lane,
# pinned so that two runs of a cell on two binaries compare like for like.
# benchmarks/run_manifest.py reads it; its docstring says how a run goes.
#
# An input is a `file` under <data>/inputs (or an --input-dir), fetched from
# `url`, or a repo `path`; either way it must hash to `sha256`. Overture
# releases leave the bucket after a few months (#696), so for the Overture
# inputs the cached copy is the reference and the URL is provenance only.
#
# A cell runs `tylertoo <command> <args> --min-zoom a --max-zoom b <flags>`.
# Placeholders: {input} (the first input, a path or a served URL),
# {files_from} (a list of every input, for --files-from), {out} (the run's
# scratch directory under .bench-out/, deleted after the run) and {setup}
# (the cell's setup directory). `output` is the file under {out} whose size
# and sha256 are recorded. `allocator` is the allocator the cell's numbers
# are expected from; the runner records the one each binary links.
# `heavy` cells run only when named (--cells or a set).

[defaults]
pairs = 3
allocator = "glibc"
wall_s = 1800
# Peak RSS cap per run: the box is shared (123 GiB), so a runaway run is
# stopped long before it can take the host down.
rss_gib = 32
# A run's scratch (outputs, spill, the intermediate overview) may not grow
# past this; nothing starts with less than min_free_gb free on the disk.
scratch_gib = 30
min_free_gb = 30
load_max = 3.0
load_wait_s = 3600

