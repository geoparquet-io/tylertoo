# ---------------------------------------------------------------------------
# Cells

[cells.points]
label = "Points: Overture places, Mexico City, geometry only"
input = "overture-place"
command = "tiles"
args = ["{input}", "{out}/out.pmtiles"]
output = "out.pmtiles"
zoom = [0, 14]
flags = ["--bbox=-101,19,-98,21", "--exclude-all-properties"]

[cells.points-dense]
label = "Dense points: Overture addresses, Mexico City"
input = "overture-address"
command = "tiles"
args = ["{input}", "{out}/out.pmtiles"]
output = "out.pmtiles"
zoom = [0, 14]
flags = ["--bbox=-101,19,-98,21"]

[cells.lines]
label = "Lines: Overture segments, central Mexico"
input = "overture-segment"
command = "tiles"
args = ["{input}", "{out}/out.pmtiles"]
output = "out.pmtiles"
zoom = [0, 13]
flags = ["--bbox=-104,17,-96,22"]

[cells.polygons]
label = "Polygons: FTW Moldova"
input = "moldova"
command = "tiles"
args = ["{input}", "{out}/out.pmtiles"]
output = "out.pmtiles"
zoom = [0, 12]

[cells.polygons-mt]
label = "Polygons at scale: FTW Mato Grosso, bounded (the #734 flags on one state)"
tickets = [734]
input = "ftw-br-mt"
command = "tiles"
args = ["{input}", "{out}/out.pmtiles"]
output = "out.pmtiles"
zoom = [0, 13]
flags = ["--profile", "bounded"]

[cells.wide-props]
label = "Wide properties: Overture places, Mexico City, every nested column kept"
input = "overture-place"
command = "tiles"
args = ["{input}", "{out}/out.pmtiles"]
output = "out.pmtiles"
zoom = [0, 14]
flags = ["--bbox=-101,19,-98,21"]

[cells.verbatim]
label = "Verbatim: Madagascar adm4, every feature at every zoom"
input = "madagascar-adm4"
command = "tiles"
args = ["{input}", "{out}/out.pmtiles"]
output = "out.pmtiles"
zoom = [0, 12]
flags = ["--verbatim"]

[cells.coverage-fill]
label = "Coverage fill: FTW Moldova, --coverage-fill"
input = "moldova"
command = "tiles"
args = ["{input}", "{out}/out.pmtiles"]
output = "out.pmtiles"
zoom = [0, 12]
flags = ["--coverage-fill"]

# The Brazil tutorial's extract (examples/brazil-fields/01-extract.sh), on a
# 1-degree box around Sorriso instead of its 20 km one (which ran in under
# 2 s): three states as one dataset over HTTP, from a host with 100 ms to
# first byte. The served bytes and requests are in each result row.
[cells.remote-multipart]
label = "Remote multi-part: three FTW states over HTTP, 100 ms TTFB, 1-degree bbox + filter"
inputs = ["ftw-br-mt", "ftw-br-go", "ftw-br-ms"]
command = "overview"
args = ["{out}/fields-ov.parquet"]
output = "fields-ov.parquet"
zoom = [0, 14]
flags = ["--files-from", "{files_from}", "--bbox=-56,-13,-55,-12",
         "--filter", "\"metrics:area\" >= 10000"]
serve = { ttfb_ms = 100 }

[cells.memory-capped]
label = "Memory-capped: FTW Mato Grosso, bounded, in a 4 GiB cgroup"
input = "ftw-br-mt"
command = "tiles"
args = ["{input}", "{out}/out.pmtiles"]
output = "out.pmtiles"
zoom = [0, 13]
flags = ["--profile", "bounded"]
memory_max = "4G"

# Resume: replay a saved convert plan, skipping pass 1 and the assignment.
[cells.resume]
label = "Resume: FTW Moldova overview from a saved plan"
input = "moldova"
command = "overview"
args = ["{input}", "{out}/ov.parquet"]
output = "ov.parquet"
zoom = [0, 12]
flags = ["--plan", "{setup}/convert.plan"]
setup = { command = "overview", args = ["{input}", "{setup}/ov.parquet"], zoom = [0, 12], flags = ["--save-plan", "{setup}/convert.plan"] }

# Export alone, from an overview the first binary builds once. These are the
# cells of the allocator A/B (#739): any allocator is expected.
[cells.export-moldova]
label = "Export: FTW Moldova z0-12 overview"
input = "moldova"
command = "export-pmtiles"
args = ["{setup}/ov.parquet", "{out}/out.pmtiles"]
output = "out.pmtiles"
allocator = "any"
setup = { command = "overview", args = ["{input}", "{setup}/ov.parquet"], zoom = [0, 12] }

[cells.export-mt]
label = "Export: FTW Mato Grosso z0-13 overview (the #731 stress case)"
tickets = [731, 739]
input = "ftw-br-mt"
command = "export-pmtiles"
args = ["{setup}/ov.parquet", "{out}/out.pmtiles"]
output = "out.pmtiles"
allocator = "any"
setup = { command = "overview", args = ["{input}", "{setup}/ov.parquet"], zoom = [0, 13] }

# #734: the convert/export split at the scale #535 measured. Hours, not
# minutes: one round unless the lead asks for more.
[cells.brazil-55m]
label = "Brazil 55.5M: every FTW state, tiles z0-13, bounded (#535 / #734)"
tickets = [734]
inputs = ["ftw-br-ac", "ftw-br-al", "ftw-br-am", "ftw-br-ap", "ftw-br-ba", "ftw-br-ce",
          "ftw-br-df", "ftw-br-es", "ftw-br-go", "ftw-br-ma", "ftw-br-mg", "ftw-br-ms",
          "ftw-br-mt", "ftw-br-pa", "ftw-br-pb", "ftw-br-pe", "ftw-br-pi", "ftw-br-pr",
          "ftw-br-rj", "ftw-br-rn", "ftw-br-ro", "ftw-br-rr", "ftw-br-rs", "ftw-br-sc",
          "ftw-br-se", "ftw-br-sp", "ftw-br-to"]
command = "tiles"
args = ["{out}/out.pmtiles"]
output = "out.pmtiles"
zoom = [0, 13]
flags = ["--files-from", "{files_from}", "--profile", "bounded"]
wall_s = 14400
pairs = 1
heavy = true

# ---------------------------------------------------------------------------
# Sets

[sets]
window1 = ["points", "points-dense", "lines", "polygons", "polygons-mt", "wide-props",
           "verbatim", "coverage-fill", "remote-multipart", "memory-capped", "resume",
           "export-moldova", "export-mt"]
export-ab = ["export-moldova", "export-mt"]
