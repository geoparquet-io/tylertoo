# Generated by `showcase.py extract netherlands`; do not edit by hand (README.md).
# The showcase cells (#810, track D), in benchmarks/manifest.toml's format:
#
#   uv run --no-project python -I benchmarks/run_manifest.py \
#       --manifest benchmarks/showcase/manifest.toml run --cells ... --bin ...
#
# Region `netherlands`: bbox 3.31,50.75,7.23,53.56 of Overture buildings 2026-10-21.0.
# Settings parity is run_e2e.py's (z0-14, buffer 8, 500,000-byte compressed
# cap). tippecanoe runs the `ovt-local` cell through tippecanoe_shim.sh.

[defaults]
pairs = 3
warmup = 1
allocator = "any"
wall_s = 9000
rss_gib = 100
scratch_gib = 45
min_free_gb = 5
load_max = 3.0
load_wait_s = 1800

# The listing pins every part by key, size and ETag. The s3:// cell reads
# the parts in place, so the listing is its input.
[inputs.overture-listing]
path = "benchmarks/showcase/overture-buildings-2026-10-21.0.tsv"
sha256 = "4d981b3ee0d61199c4e999b7b96bf81d71f4a447237e25c527eb88e410155bdd"

[inputs.overture-netherlands]
file = "overture-2026-10-21.0-buildings-netherlands.parquet"
sha256 = "e68dd09a7ac20994b54bddb36e5d8242966bd447f694aaa027df069db5cf7308"
bytes = 1880912665
geometry = "Polygon"
notes = "gpio 1.7.0 extract geoparquet --bbox 3.31,50.75,7.23,53.56 --include-cols class,subtype,height of s3://overturemaps-us-west-2/release/2026-10-21.0/theme=buildings/type=building/"

[cells.ovt-s3]
label = "Overture buildings netherlands: tylertoo straight from s3://"
tickets = [664]
input = "overture-listing"
command = "tiles"
args = ["s3://overturemaps-us-west-2/release/2026-10-21.0/theme=buildings/type=building/", "{out}/out.pmtiles"]
output = "out.pmtiles"
zoom = [0, 14]
flags = ["--layer-name", "buildings", "--tile-buffer", "8", "--max-compressed-tile-size", "500000", "--max-tile-size", "0", "--include-property", "class", "--include-property", "subtype", "--include-property", "height", "--bbox=3.31,50.75,7.23,53.56"]
env = { AWS_REGION = "us-west-2", AWS_SKIP_SIGNATURE = "true" }
watch = "tmp"
pairs = 1
warmup = 0
heavy = true

[cells.ovt-local]
label = "Overture buildings netherlands: the local extract (tylertoo, or tippecanoe via the shim)"
tickets = [664]
input = "overture-netherlands"
command = "tiles"
args = ["{input}", "{out}/out.pmtiles"]
output = "out.pmtiles"
zoom = [0, 14]
flags = ["--layer-name", "buildings", "--tile-buffer", "8", "--max-compressed-tile-size", "500000", "--max-tile-size", "0", "--include-property", "class", "--include-property", "subtype", "--include-property", "height"]
watch = "tmp"
heavy = true
