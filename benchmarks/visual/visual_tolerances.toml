# Bands of the visual gate (benchmarks/visual/gate.py, #869).
#
# The gated number is d = tylertoo's error - tippecanoe's error, each measured
# against the source on the same tiles, for the worst tiles of a zoom (the
# max, p99 and p95 over the sampled tiles) and for the seams. An error is a
# share between 0 and 1, so d = +0.05 means tylertoo's worst tile loses five
# percentage points more of the source than tippecanoe's.
#
# The pair_* cells compare the two archives directly, tile against tile, with
# no source: pair_iou_loss (1 - IoU of the polygon area the tools draw), pair_attr (area
# both draw with different attribute values), pair_apart (line length more
# than a pixel from the other tool's) and pair_count (points not matched per
# grid cell). 0 means the two tiles draw the same; the value is its own d.
#
# Each band is the measured d with 0.01 of headroom on both sides, and its
# comment carries the measured values. It is a ratchet:
#
#   * d above the band: tylertoo draws worse than it did. Fix the code.
#   * d below the band: tylertoo draws better than it did. Tighten the band
#     in the same PR, with the new measurement in the comment.
#
# A band changes only in a PR that states the new measurement. It is never
# widened to make a run pass.
#
# The measurements do not depend on the machine: both archives are
# deterministic (tippecanoe runs without -P) and the metrics are rasters of
# decoded tiles. Two full runs from scratch gave identical numbers.
#
# A zoom and metric without a band, or a dataset given with --dataset, takes
# [gate].default_band: it fails when tylertoo is more than 0.02 worse and has
# no lower side.
#
# What the numbers show where d is not about 0:
#
#   vd-points z8-z12  count_error is near 1 for both tools: both thin points
#                     heavily at coarse zooms. tylertoo keeps a few more
#                     (d < 0). pair_count is high there too: the two tools
#                     keep different points. At z14 both keep every point and
#                     pair_count is 0.

schema_version = 1

[gate]
# Both tools tile this range; tippecanoe's dropping is anchored at its -z.
zoom_range = [0, 14]
# Scored zooms of a dataset that names none.
zooms = [6, 10, 14]
default_band = [-1.0, 0.02]

# `gate.py --self-test` injects the defects of mutate.py here.
[self_test]
dataset = "madagascar-adm4"
zooms = [6, 8, 10]

