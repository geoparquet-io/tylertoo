vertices = [0.23, 0.46]       # measured z9 0.270, z10 0.413
bytes = [0.27, 0.49]          # measured z9 0.303, z10 0.431 (z9 0.311, z10 0.448 before libdeflate gzip)

[[datasets."open-buildings".zoom_bands]]
