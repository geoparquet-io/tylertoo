[[datasets."open-buildings".zoom_bands]]
zooms = [13, 13]
tiles = [0.95, 1.05]          # measured 1.000 (20 / 20)
features = [0.97, 1.04]       # measured 1.003 (1,061 / 1,058; 0.897 before #745)
vertices = [0.77, 0.87]       # measured 0.823
