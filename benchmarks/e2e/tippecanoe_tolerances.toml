tile_features_median = [0.95, 1.05]  # measured 1.000 over 20 shared tiles

[[datasets."open-buildings".zoom_bands]]
zooms = [14, 14]
tiles = [0.99, 1.01]          # measured 1.000 (52 / 52)
features = [1.00, 1.05]       # measured 1.026 (1,128 / 1,099): (C)
vertices = [1.00, 1.06]       # measured 1.031: (B) at the canonical zoom
bytes = [1.04, 1.16]          # measured 1.102
tile_features_median = [0.99, 1.01]  # measured 1.000 over 52 shared tiles

