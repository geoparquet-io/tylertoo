# Cases for the Tylertoo-Voice rules, run by `vale test` (Vale >= 3.24).
# They live outside StylesPath so older Vale releases, which reject a
# rule's `tests:` key, can still load the styles.

- name: AffirmativeNegativeEcho flags the pattern
  rule: ../styles/Tylertoo-Voice/AffirmativeNegativeEcho.yml
  input: "It reads the policy. It does not read the answers."
  contains: Tylertoo-Voice.AffirmativeNegativeEcho

- name: AffirmativeNegativeEcho leaves clean prose alone
  rule: ../styles/Tylertoo-Voice/AffirmativeNegativeEcho.yml
  input: "Although it reads the policy, the answers remain unavailable."
  absent: Tylertoo-Voice.AffirmativeNegativeEcho

