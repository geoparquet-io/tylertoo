[package]
name = "tylertoo-python"
description = "Python bindings for tylertoo"
version.workspace = true
edition.workspace = true
# mlt-core (default `mlt` feature, #823) needs 1.98; the libraries keep the
# workspace's 1.95.
rust-version = "1.98"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Ships as a wheel via maturin, never to crates.io; this also blocks an
# accidental `cargo publish --workspace`.
publish = false

[lib]
name = "tylertoo"
crate-type = ["cdylib"]

[features]
default = ["mimalloc", "mlt"]
# MapLibre Tile output (#823), on by default; see tylertoo-core's `mlt`.
mlt = ["tylertoo-core/mlt"]
# mimalloc as the extension's global allocator on every target, as for the
# CLI (#739, #788, #792); `--no-default-features` builds with the system
# allocator. musl targets (musllinux) always get it, below, whatever this
# feature says. Only the extension's own
# Rust allocations go through it: the interpreter's allocator is untouched,
# and every Rust allocation is freed by Rust (data reaches Python as copies).
mimalloc = ["dep:mimalloc"]
# dhat owns the global allocator (installed in tylertoo-core), so mimalloc is
# compiled out under it; rustc allows only one in the crate graph.
dhat-heap = ["tylertoo-core/dhat-heap"]

[dependencies]
tylertoo-core = { workspace = true, features = ["remote"] }
# abi3-py311: build against CPython's stable ABI so a single wheel per
# platform covers every CPython >= 3.11 (matching `requires-python`).
# This binding is a thin facade over tylertoo-core -- it only uses the
# pyo3 safe API, no version-specific C API -- so the stable ABI costs
# nothing here.
pyo3 = { workspace = true, features = ["abi3-py311"] }
pyo3-log = { workspace = true }
# The CLI itself, as a library: `python -m tylertoo` calls `tylertoo_cli::run`
# (#819). No default features: the allocator lives in its binary, not here.
tylertoo = { path = "../cli", default-features = false }
# Report structs (already serde::Serialize in core) to Python dicts.
pythonize = "0.29"
serde = { workspace = true }
# Flat keyword values are normalized by core syntax adapters.
serde_json = "1"
# local_dynamic_tls: a dlopen'd extension must not use initial-exec TLS,
# which glibc fits into a small static block (#823's mlt-core TLS overflowed it).
mimalloc = { version = "0.1", optional = true, features = ["local_dynamic_tls"] }

# musllinux wheels: musl's mallocng fails small allocations under
# multi-threaded fragmentation (#480), the failure the musl CLI binary avoids
# with mimalloc. The wheel runs the same pipeline, so it gets the same fix.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", features = ["local_dynamic_tls"] }

[lints]
workspace = true

[build-dependencies]
tylertoo-core = { workspace = true }
serde_json = "1"

[dev-dependencies]
tylertoo-core = { workspace = true, features = ["cli"] }
clap = { workspace = true }
pyo3 = { workspace = true, features = ["auto-initialize"] }
