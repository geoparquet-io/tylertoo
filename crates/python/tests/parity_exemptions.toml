# Surface-parity exemption ledger for the Python API (#779, track G2).
#
# Read by tests/test_parity.py. Every entry has a reason and an issue
# number; PINNED there holds the number of entries per table and kind.
#
# `xfail = true` marks known drift: the pair runs as a strict xfail, so it
# fails once the drift is fixed and the entry is still here. #779's F3
# track (Python built from one core TilesConfig) removes these entries.
#
# Tables:
#   [[flag]]     a CLI flag with no keyword argument (`command` is the CLI
#                command; `flag` its long spelling or positional id).
#   [[kwarg]]    a keyword argument with no CLI flag.
#   [[default]]  a flag and keyword argument whose defaults differ.


