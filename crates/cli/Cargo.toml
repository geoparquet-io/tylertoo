[package]
name = "tylertoo"
description = "CLI tool for converting GeoParquet to PMTiles vector tiles"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# mimalloc is the default global allocator (#739); `--no-default-features`
# builds on the platform allocator (glibc malloc) instead.
default = ["mimalloc"]
dhat-heap = ["tylertoo-core/dhat-heap", "dhat"]
# Off by default: compiles the hidden `gen-reference-docs` subcommand (and its
# clap-markdown dependency) out of production builds. CI enables it to
# regenerate docs/reference/cli.md and diff-guard the committed copy.
gen-docs = ["dep:clap-markdown"]
# mimalloc as the global allocator on every target, not only musl (#739).
# On by default: against glibc malloc on the #788 benchmark lane (isolated
# cores, identical archives) export ran in 0.68x (Moldova) and 0.79x (NZ)
# the wall time, convert pass 2 in 0.92x, total CPU 0.83x; peak RSS +30% on
# Moldova, -23% on NZ, -12% on Mato Grosso, and a bounded run under a 4 GiB
# cap completed. musl uses mimalloc unconditionally (#480) whatever this
# says. Ignored under `dhat-heap` (dhat owns the allocator).
mimalloc = ["dep:mimalloc"]

[[bin]]
name = "tylertoo"
path = "src/main.rs"

[dependencies]
tylertoo-core = { workspace = true, features = ["remote", "cli"] }
clap = { workspace = true }
anyhow = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
indicatif = { workspace = true }
serde = { workspace = true }
serde_json = "1"
dhat = { version = "0.3", optional = true }
# Exact pin (not caret): the CI drift-guard regenerates reference/cli.md and
# fails on any byte change — so a new clap-markdown patch with different
# output would break unrelated PRs. Bump deliberately and regenerate.
# Dependabot proposes the bump.
# Cargo.lock is now committed (#412), so the lock alone already holds the
# version steady across CI runs; the exact pin can be relaxed to a caret in a
# follow-up (the last open box on #412).
clap-markdown = { version = "=0.1.5", optional = true }
# Global allocator for non-musl targets, on by default (#739); see the
# `mimalloc` feature. The musl table below keeps it unconditional there.
mimalloc = { version = "0.1", optional = true }

# musl-only global allocator (#480). musl's mallocng fails small allocations
# under heavy multi-threaded fragmentation long before memory is exhausted;
# mimalloc replaces it for the static-musl release binary only. Default
# features on purpose: `secure` stays OFF (hardened mode costs throughput and
# buys nothing here), and the default C source line is mimalloc v3, whose
# arena/page-map design is the one that targets exactly this fragmentation
# failure. If v3 ever misbehaves on a musl host, `features = ["v2"]` pins the
# older, longer-deployed mimalloc 2.x line without any code change. The
# bundled C sources compile with the same musl-targeting `cc` toolchain
# (`musl-tools`' musl-gcc) that zstd-sys/aws-lc-sys already need in
# release.yml.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
# Synthetic GeoParquet fixtures written by the CLI integration tests.
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
tylertoo-io = { workspace = true, features = ["test-support"] }
# Snapshot tests of the CLI's stdout/stderr/exit code (tests/cmd, #613).
trycmd = "1.2.1"


[lints]
workspace = true

# cargo-binstall metadata: points at the tarballs/zip release.yml already
# publishes (tylertoo-$VERSION-$TARGET{.tar.gz,.zip}), so `cargo binstall
# tylertoo` resolves a prebuilt binary instead of falling back to a
# from-source build. `{ archive-suffix }` with `pkg-fmt = "tgz"` makes
# binstall probe both `.tgz` and `.tar.gz` and use whichever exists — see
# https://github.com/cargo-bins/cargo-binstall/blob/main/crates/binstalk-fetchers/src/gh_crate_meta.rs
# (PkgFmt::Tgz -> [".tgz", ".tar.gz"]) — so this resolves to the real
# `.tar.gz` assets without needing a non-standard pkg-fmt value. Each
# archive's binary sits one directory down (release.yml stages it under
# `tylertoo-$VERSION-$TARGET/`), hence the explicit `bin-dir`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/tylertoo-{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "tylertoo-{ version }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
