# Surface-parity exemption ledger for the CLI (#779, track G2).
#
# Read by crates/cli/tests/parity/in_crate.rs, which is compiled into the
# binary's unit tests. Every entry has a reason and an issue number. The
# number of entries per table and kind is pinned in PINNED there, so adding
# or dropping one shows up in review.
#
# `xfail = true` marks known drift, not an allowed difference. The test
# passes while the drift is there, and fails once it is gone and the entry
# remains, like a strict pytest xfail. #779's F3 track (one TilesConfig, one
# builder per command) removes these entries.
#
# Tables:
#   [[parsed_unused]]     (c) a flag whose change leaves the core options the
#                         command's builder makes unchanged. exempt: the flag
#                         is presentation only. xfail: the flag is mapped
#                         inline in a run_* function no test can call.
#   [[defaults]]          (b) a core options field whose clap default differs
#                         from the core Default on purpose.
#   [[pyramid_vs_tiles]]  (d) a flag on `tiles` and not `pyramid`, or the
#                         reverse. xfail: an export knob pyramid lacks.


