[package]
name = "tylertoo-io"
description = "Checked Parquet and Arrow IPC I/O for tylertoo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
remote = ["dep:object_store"]
testing = []
# Raw fixture builders for downstream tests and benchmarks only.
test-support = []

[dependencies]
parquet.workspace = true
arrow-ipc.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-cast.workspace = true
arrow-select.workspace = true
bytes = "1"
log.workspace = true
thiserror.workspace = true
object_store = { version = "0.14", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
