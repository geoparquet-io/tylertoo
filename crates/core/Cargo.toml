[package]
name = "tylertoo-core"
description = "Core library for converting GeoParquet to PMTiles vector tiles"
readme = "README.md"
documentation = "https://docs.rs/tylertoo-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# docs.rs documents the public `remote` feature; `fuzzing` and `dhat-heap`
# are internal hooks and stay out of the published API docs.
[package.metadata.docs.rs]
features = ["remote"]

[features]
default = []
# Scaled byte-array ceilings for the isolated integration-test lane only.
testing = []
dhat-heap = ["dhat"]
# Fuzz hooks (#424): `#[doc(hidden)]` entry points that let the standalone
# `fuzz/` crate reach parsers which are private on purpose (the MVT tile
# decode inside `decode`, `pyramid::BandArchive`). Never enabled by default,
# never part of the public API baseline; only `fuzz/Cargo.toml` turns it on.
fuzzing = []
# Remote input support: read GeoParquet directly from s3://, https://,
# and gs:// URLs via range requests (issue #210). Off by default to keep
# the pure-local library build dependency-light; the CLI enables it.
remote = [
    "dep:object_store",
    "dep:tokio",
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-smithy-types",
    "dep:async-trait",
    "dep:futures-util",
    "dep:url",
]

[dependencies]
dhat = { version = "0.3", optional = true }
geoarrow = { workspace = true }
geoarrow-array = { workspace = true }
geo-traits = { workspace = true }
geoparquet = { workspace = true }
parquet = { workspace = true }
arrow-schema = { workspace = true }
arrow-array = { workspace = true }
arrow-select = { workspace = true }
arrow-ipc = { workspace = true }
arrow-cast = { workspace = true }
# --filter evaluation kernels (overview/filter.rs).
arrow-ord = { workspace = true }
arrow-arith = { workspace = true }
arrow-buffer = { workspace = true }
geo = { workspace = true }
wkb = { workspace = true }
prost = { workspace = true }
rayon = { workspace = true }
crossbeam-channel = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
memory-stats = { workspace = true }
flate2 = "1"
# brotli and zstd follow parquet's majors (8 / 0.13) so each compiles once (#435).
# Dependabot ignores newer majors; move them only with parquet (#649).
brotli = "8"
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3", "std"] }
# PMTiles tile ids: the Hilbert index at each zoom (the crate pmtiles-rs uses).
fast_hilbert = "2.1"
# Orphan-cell nearest lookup (overview/cluster.rs); 0.12 is the version geo
# already pulls in.
rstar = "0.12"
serde = { workspace = true }
# 1.0.129: Value::sort_all_objects (overview/writer.rs).
serde_json = "1.0.129"
i_overlay = "9"
tempfile = "3"
object_store = { version = "0.14", features = ["aws", "gcp", "http"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"], optional = true }
aws-config = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
# Pinned below 1.7.0: aws-smithy-types 1.7.0 added a variant to its
# non_exhaustive `Document` enum, which aws-smithy-json 0.63.0 -- the version
# aws-config 1.12 still requires -- does not handle, so a fresh resolution of
# the `remote` feature fails to compile upstream (E0004/E0308 inside
# aws-smithy-json). Not our code.
# Cargo.lock is now committed (#412), so CI no longer re-resolves on every
# run and the pin is no longer load-bearing for that reason -- the lock holds
# 1.6.3 on its own. Keep it only until the upstream fix lands.
# TODO: drop this pin once aws-config requires aws-smithy-json >= 0.64.
aws-smithy-types = { version = "=1.9.0", optional = true }
async-trait = { version = "0.1", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
url = { version = "2", optional = true }
bytes = "1"
# Non-optional since #439: the tiles facade's #314 free-space preflight
# guards a LOCAL intermediate overview, so the probe cannot ride the
# `remote` feature (which the #272 remote-spill preflight still uses too).
fs4 = "1.1"
# 0.3.4 floor: 0.3.3 dropped `impl From<GlobError> for io::Error`, which
# 0.3.4 restored. See the `into` call in input_set::expand_glob.
glob = "0.3.4"

# Linux-only: statfs(2) for best-effort tmpfs/ramfs detection of the
# remote-input spill directory (#273). Compiles to a no-op elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Unix-only, benches/tests only: getrusage(2) for the `assign_scaling`
# harness's peak-RSS line (#565). The shipped crate does not gain a dependency.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[build-dependencies]
prost-build = { workspace = true }

[dev-dependencies]
# CodSpeed's criterion shim (#614): identical API, so the benches still
# `use criterion::…`. Under `cargo codspeed` it measures instruction counts;
# under plain `cargo bench` it is ordinary criterion.
criterion = { package = "codspeed-criterion-compat", version = "5", features = ["html_reports"] }
serde_json = "1"
proptest = { workspace = true }
# Test and bench fixtures only: decoding WKB literals into geo types.
geozero = { workspace = true }

[[bench]]
name = "clipping"
harness = false

[[bench]]
name = "bbox_containment"
harness = false

[[bench]]
name = "pass1_decode"
harness = false

[[bench]]
name = "assign"
harness = false

[[bench]]
name = "simplify_cascade"
harness = false

[[bench]]
name = "mvt_encode"
harness = false

[[bench]]
name = "tile_compress_dedup"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "assign_scaling"
harness = false

[[bench]]
name = "hostile_geometry"
harness = false

[[bench]]
name = "coverage_fill"
harness = false

[lints]
workspace = true

# aws-smithy-types is a version-pin only (see the comment beside it); no code
# in this crate references it directly.
[package.metadata.cargo-shear]
ignored = ["aws-smithy-types"]

[[test]]
name = "scaled_limits"
required-features = ["testing"]
